<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Block Quest</title>
<meta name="description" content="Dig, craft and farm your way through brain-teasing block puzzles.">
<meta name="theme-color" content="#3f7fd9">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Block Quest">
<link rel="preload" href="../fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url("../fonts/baloo2-600.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("../fonts/baloo2-800.woff2") format("woff2"); }

/* Layout: a fixed top bar, then one screen at a time (world map, level picker, puzzle). Puzzles stack
   question, board and controls in a centred column. One deliberate daylight look; caves and huts tint their screens. */
:root {
  --sky: #5aa6f0;
  --sky-deep: #3f7fd9;
  --grass: #5fb34a;
  --grass-dark: #3c7f2e;
  --soil: #8a5a34;
  --ink: #fdf6e3;
  --ink-dark: #1e1a2e;
  --panel: rgba(20, 16, 36, 0.78);
  --gold: #ffd23f;
  --gold-dark: #b7791f;
  --pink: #f472d0;
  --bad: #ff5d73;
  --font: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; height: 100%;
  background: var(--sky); color: var(--ink);
  font-family: var(--font); font-weight: 600; font-size: 1.05rem;
  overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }

/* top bar */
.top {
  display: flex; align-items: center; gap: 8px;
  padding-block: 10px;
  padding-left: max(12px, env(safe-area-inset-left, 0px));
  padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 800; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.ibtn {
  flex: none; width: 46px; height: 46px; display: grid; place-items: center;
  background: var(--panel); border: 3px solid rgba(255,255,255,.18); border-radius: 12px;
  color: var(--ink); cursor: pointer; text-decoration: none; padding: 0;
}
.ibtn svg { width: 24px; height: 24px; }
.ibtn:focus-visible, .btn:focus-visible, .cell:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }
#sound .mute, #sound[aria-pressed="false"] .waves { display: none; }
#sound[aria-pressed="false"] .mute { display: inline; }

.screen {
  flex: 1; min-height: 0; overflow-y: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 4px 20px;
}
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 14px; }
#stage { width: 100%; gap: 12px; }

/* world map */
.hero { text-align: center; }
.hero h2 { margin: 6px 0 0; font-size: clamp(2.6rem, 12vw, 4rem); line-height: 1; font-weight: 800; color: var(--ink); text-shadow: 0 4px 0 var(--grass-dark), 0 7px 0 rgba(0,0,0,.25); }
.hero p { margin: 8px 0 0; font-size: 1.15rem; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
.pip-hero { width: 72px; height: 72px; display: block; margin: 0 auto; image-rendering: pixelated; }
.areas { display: grid; gap: 16px; width: 100%; }
.area {
  display: grid; grid-template-columns: 84px 1fr; align-items: center; gap: 14px;
  padding: 14px; border: none; border-radius: 6px; cursor: pointer; text-align: left;
  background: var(--panel); color: var(--ink);
  box-shadow: 0 6px 0 rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.12);
}
.area:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.12); }
.area .art { width: 84px; height: 84px; border-radius: 4px; image-rendering: pixelated; background-size: 50% 50%; display: grid; place-items: center; }
.area .art svg { width: 56px; height: 56px; }
.area b { display: block; font-size: 1.5rem; line-height: 1.1; }
.area span { display: block; font-size: .98rem; opacity: .85; }
.area .prog { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-weight: 800; }
.area .prog svg { width: 20px; height: 20px; }
.ground { width: 100%; height: 26px; background: var(--t-grass) 0 0 / 26px 26px repeat-x; image-rendering: pixelated; border-radius: 4px; }

/* level picker */
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; width: 100%; }
.lvl {
  aspect-ratio: 1; max-width: 100%; border: none; border-radius: 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 1.9rem; font-weight: 800; color: var(--ink);
  background: var(--panel); box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 0 0 3px rgba(255,255,255,.12);
}
.lvl:disabled { opacity: .45; cursor: default; }
.lvl .stars { display: flex; gap: 1px; }
.lvl .stars svg { width: 18px; height: 18px; }
.lvl svg.lock { width: 28px; height: 28px; }
.lvl.next { box-shadow: 0 5px 0 rgba(0,0,0,.35), inset 0 0 0 4px var(--gold); }

/* puzzle screen */
.q { margin: 0; text-align: center; font-size: clamp(1.35rem, 5.2vw, 1.9rem); font-weight: 800; line-height: 1.15; text-wrap: balance; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.status { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 999px; padding: 4px 14px 4px 8px; font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.chip svg { width: 26px; height: 26px; image-rendering: pixelated; }
.chip.low { color: var(--bad); }
.msg { min-height: 1.6em; text-align: center; font-size: 1.15rem; font-weight: 800; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.4); max-width: 32ch; text-wrap: balance; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn {
  border: none; border-radius: 6px; cursor: pointer;
  padding: 8px 20px; font-size: 1.2rem; font-weight: 800; color: var(--ink-dark);
  background: var(--gold); box-shadow: 0 5px 0 var(--gold-dark);
  display: inline-flex; align-items: center; gap: 8px;
}
.btn svg { width: 22px; height: 22px; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--gold-dark); }
.btn.alt { background: #e8e2f4; box-shadow: 0 5px 0 #8f86a8; }
.btn:disabled { opacity: .5; cursor: default; }

/* tile grids */
.board {
  --cols: 8;
  --c: clamp(30px, min(calc((100vw - 52px) / var(--cols)), calc((100dvh - 330px) / var(--rows, 7))), 58px);
  display: grid; grid-template-columns: repeat(var(--cols), var(--c)); gap: 2px;
  padding: 4px; border-radius: 6px; background: rgba(0,0,0,.35);
  max-width: 100%;
}
.cell {
  width: var(--c); height: var(--c); position: relative; padding: 0; border: none; border-radius: 2px;
  background-color: transparent; background-size: cover; image-rendering: pixelated;
  display: grid; place-items: center; cursor: pointer;
}
.cell > svg { width: 86%; height: 86%; image-rendering: pixelated; position: relative; z-index: 2; }
.t-sky { background-color: #8cc8ff; }
.t-tunnel { background-image: var(--t-tunnel); }
.t-dirt { background-image: var(--t-dirt); }
.t-grass { background-image: var(--t-grass); }
.t-stone { background-image: var(--t-stone); }
.t-hard { background-image: var(--t-hard); }
.t-metal { background-image: var(--t-metal); }
.t-lava { background-image: var(--t-lava); }
.t-rock { background-image: var(--t-stone); }
.t-farm { background-image: var(--t-farm); }
.t-block { background-image: var(--t-plank); box-shadow: inset 0 0 0 2px var(--gold); }
.t-air { background-color: rgba(255,255,255,.08); }
.t-water { background-image: var(--t-water); }
.pips { position: absolute; left: 3px; bottom: 3px; display: flex; gap: 2px; z-index: 3; }
.pips i { width: 6px; height: 6px; background: #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.6); }
.crack::after { content: ""; position: absolute; inset: 0; background: var(--t-crack) center / cover; image-rendering: pixelated; opacity: .85; z-index: 1; }
.dot::before { content: ""; position: absolute; width: 26%; height: 26%; background: var(--gold); box-shadow: 0 0 0 2px #000; z-index: 4; }
.hit { animation: shake .18s; }
.bad { box-shadow: inset 0 0 0 4px var(--bad) !important; }
@keyframes shake { 33% { transform: translateX(-3px); } 66% { transform: translateX(3px); } }

/* crafting */
.cards { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.card {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px;
  background: rgba(30, 20, 10, .55); box-shadow: inset 0 0 0 3px rgba(255,255,255,.12);
}
.card { flex: 0 1 calc(50% - 4px); min-width: 0; justify-content: center; }
.card .out { min-width: 0; }
.card .name { font-size: .8rem; font-weight: 800; text-align: center; line-height: 1.05; overflow-wrap: anywhere; }
.card .out { display: flex; flex-direction: column; align-items: center; gap: 2px; }
.card .out svg { width: 36px; height: 36px; image-rendering: pixelated; }
.card .arrow { font-size: 1.2rem; font-weight: 800; opacity: .8; }
.card.goal { box-shadow: inset 0 0 0 3px var(--gold); }
.mini { display: grid; grid-template-columns: repeat(3, 18px); gap: 2px; padding: 3px; background: #6b4a2b; border-radius: 3px; }
.mini i { width: 18px; height: 18px; background: #3d2a18 center / cover; image-rendering: pixelated; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: .9rem; color: var(--gold); }
.mini i svg { width: 100%; height: 100%; }
.table { display: grid; grid-template-columns: repeat(3, clamp(50px, min(17vw, 8dvh), 80px)); gap: 5px; padding: 8px; background: #7a5534 var(--t-plank) 0 0 / 48px 48px; border-radius: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.35); image-rendering: pixelated; }
.slot { aspect-ratio: 1; max-width: 100%; border: none; border-radius: 3px; background: #3d2a18 center / cover; image-rendering: pixelated; cursor: pointer; padding: 0; display: grid; place-items: center; }
.slot svg { width: 80%; height: 80%; }
.slot.locked { cursor: default; box-shadow: inset 0 0 0 3px rgba(255,255,255,.25); }
.palette { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.pal {
  width: 58px; height: 58px; border: none; border-radius: 6px; cursor: pointer; padding: 6px;
  background: var(--panel); box-shadow: inset 0 0 0 3px rgba(255,255,255,.15);
  display: grid; place-items: center;
}
.pal i { width: 100%; height: 100%; background: center / cover; image-rendering: pixelated; border-radius: 2px; display: grid; place-items: center; }
.pal i svg { width: 100%; height: 100%; }
.pal[aria-pressed="true"] { box-shadow: inset 0 0 0 4px var(--gold), 0 0 0 3px var(--gold); transform: translateY(-3px); }

.lvl.endless { grid-column: span 2; aspect-ratio: auto; min-height: 84px; flex-direction: row; gap: 12px; }
.lvl .inf { font-size: 2.6rem; line-height: 1; color: var(--gold); }
.lvl .small { font-size: 1rem; }
.lvl.endless svg.lock { width: 24px; height: 24px; }

.whoami { display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800; }
.whoami svg { width: 30px; height: 30px; background: var(--panel); border-radius: 6px; padding: 2px; }
.whoami a { color: var(--ink); }

/* builder's yard */
.views { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.view { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border-radius: 6px; background: var(--panel); box-shadow: inset 0 0 0 3px var(--vc); }
.view.front { --vc: #5aa6f0; } .view.side { --vc: #ff9f43; } .view.top { --vc: #f4e3b5; }
.view.bad { box-shadow: inset 0 0 0 4px var(--bad); }
.view span { font-weight: 800; font-size: .9rem; color: var(--vc); }
.view.bad span { color: var(--bad); }
.vgrid { display: grid; gap: 2px; }
.vgrid i { width: clamp(16px, 5vw, 22px); height: clamp(16px, 5vw, 22px); background: rgba(255,255,255,.08); border-radius: 2px; }
.vgrid i.on { background: var(--vc); box-shadow: inset 0 0 0 2px rgba(0,0,0,.35); }
.iso { width: min(46vw, 210px); height: min(42vw, 190px); max-width: 100%; }
.iso.target { width: min(70vw, 260px); height: min(60vw, 220px); background: var(--panel); border-radius: 6px; }
.work { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
.padwrap { display: grid; grid-template-columns: auto 18px; grid-template-rows: auto 18px; gap: 4px; }
.hgrid { display: grid; gap: 4px; width: min(42vw, 190px); }
.hcell { aspect-ratio: 1; max-width: 100%; border: none; border-radius: 4px; cursor: pointer; font-weight: 800; font-size: 1.5rem; color: var(--ink-dark); background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 2px rgba(255,255,255,.2); }
.hcell.h1 { background: #f4e3b5; } .hcell.h2 { background: #e8c86e; } .hcell.h3 { background: #d9a520; } .hcell.h4 { background: #b7791f; }
.frontbar, .sidebar { font-size: .7rem; font-weight: 800; letter-spacing: .08em; display: grid; place-items: center; border-radius: 3px; color: var(--ink-dark); }
.frontbar { background: #5aa6f0; grid-column: 1; grid-row: 2; }
.sidebar { background: #ff9f43; grid-column: 2; grid-row: 1; writing-mode: vertical-rl; }
body.yard { background: #3b4a6b; }

.yb {
  --c: clamp(40px, min(calc(52vw / var(--n)), calc(26dvh / var(--n))), 64px);
  --t: calc(var(--c) * .42);
  display: grid; gap: 6px;
  grid-template-columns: calc(var(--c) * var(--n) + 4px * (var(--n) - 1)) calc(var(--t) * var(--mh) + 2px * (var(--mh) - 1));
  grid-template-areas: "fcap tcap" "fv tv" "pad sv" "fbar scap";
  align-items: end;
}
.yb .cap { font-size: .8rem; font-weight: 800; letter-spacing: .04em; text-align: center; }
.yb .cap.f { grid-area: fcap; color: #5aa6f0; } .yb .cap.t { grid-area: tcap; color: #f4e3b5; } .yb .cap.s { grid-area: scap; color: #ff9f43; align-self: start; }
.fview { grid-area: fv; display: grid; grid-template-columns: repeat(var(--n), var(--c)); grid-template-rows: repeat(var(--mh), var(--t)); gap: 2px 4px; }
.sview { grid-area: sv; display: grid; grid-template-rows: repeat(var(--n), var(--c)); grid-template-columns: repeat(var(--mh), var(--t)); gap: 4px 2px; align-self: stretch; }
.tview { grid-area: tv; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; padding: 3px; background: rgba(0,0,0,.25); border-radius: 4px; }
.tview i { aspect-ratio: 1; }
.fview i, .sview i, .tview i { border-radius: 3px; background: rgba(255,255,255,.07); }
.fview i.on { background: #5aa6f0; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
.sview i.on { background: #ff9f43; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
.tview i.on { background: #f4e3b5; box-shadow: inset 0 0 0 2px rgba(0,0,0,.3); }
.fview i.bad, .sview i.bad, .tview i.bad { outline: 3px solid var(--bad); outline-offset: -1px; }
.fview.off, .sview.off, .tview.off { visibility: hidden; }
.yb .hgrid { grid-area: pad; width: auto; grid-template-columns: repeat(var(--n), var(--c)); gap: 4px; }
.yb .hcell { width: var(--c); height: var(--c); }
.yb .hcell.miss { box-shadow: inset 0 0 0 3px var(--bad); }
.yb .hcell.hint { box-shadow: inset 0 0 0 4px var(--gold), 0 0 14px var(--gold); }
.yb .frontbar { grid-area: fbar; height: 18px; }
.yb.plain { grid-template-areas: "pad" "fbar"; grid-template-columns: auto; }
.yb.plain .fview, .yb.plain .sview, .yb.plain .tview, .yb.plain .cap { display: none; }
.iso.small { width: min(60vw, 220px); height: min(44vw, 170px); }

/* village market */
body.market { background: #4a6b3b; }
.goalbox, .pack { width: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; background: var(--panel); }
.goalbox { box-shadow: inset 0 0 0 3px var(--gold); }
.lbl { font-size: .8rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .8; margin-right: 4px; }
.it { display: inline-flex; align-items: center; gap: 2px; font-weight: 800; font-size: 1.15rem; }
.it svg { width: 32px; height: 32px; image-rendering: pixelated; }
.goalbox .it { opacity: .45; } .goalbox .it.got { opacity: 1; }
.pack .empty { opacity: .6; }
.stalls { width: 100%; display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 8px; }
.stall {
  display: flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: nowrap;
  padding: 8px 4px; min-height: 54px; min-width: 0; border: none; border-radius: 6px; cursor: pointer; color: var(--ink-dark);
  background: #f4e3b5 var(--t-plank) 0 0 / 40px 40px; image-rendering: pixelated;
  box-shadow: 0 4px 0 #8e5f2e, inset 0 0 0 3px rgba(0,0,0,.15);
}
.stall .give, .stall .get { display: inline-flex; align-items: center; gap: 1px; background: rgba(30,20,10,.82); color: var(--ink); border-radius: 4px; padding: 2px 5px; white-space: nowrap; }
.stall .it svg { width: 26px; height: 26px; }
.stall .it { font-size: 1.05rem; }
.stall .plus { font-weight: 800; margin: 0 1px; }
.stall .arr { font-weight: 800; font-size: 1.2rem; color: var(--ink); background: rgba(30,20,10,.82); border-radius: 4px; padding: 0 3px; }
.stall:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 #8e5f2e; }
.stall:disabled { filter: grayscale(.55) brightness(.72); cursor: default; }
.stall.hinted { box-shadow: 0 4px 0 #8e5f2e, 0 0 0 4px var(--gold), 0 0 18px var(--gold); }

/* overlay */
.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10, 8, 20, .72); padding: 20px; }
.win {
  width: min(380px, 100%); text-align: center; padding: 22px 18px 20px; border-radius: 8px;
  background: #2b2140; box-shadow: 0 8px 0 rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.12);
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.win h2 { margin: 0; font-size: 2.1rem; line-height: 1.05; font-weight: 800; color: var(--gold); text-wrap: balance; }
.win p { margin: 0; font-size: 1.1rem; max-width: 28ch; }
.bigstars { display: flex; gap: 6px; }
.bigstars svg { width: 56px; height: 56px; animation: pop .45s backwards; }
.bigstars svg:nth-child(2) { animation-delay: .15s; } .bigstars svg:nth-child(3) { animation-delay: .3s; }
.trophy { width: 110px; height: 110px; image-rendering: pixelated; animation: pop .5s; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }

/* area tints */
body.mines { background: #2a2233; }
body.hut { background: #5b3f28; }
body.farm { background: var(--sky); }
@media (prefers-reduced-motion: reduce) { .hit, .bigstars svg, .trophy { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ibtn" id="back" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 4L2 12l8 8v-5h12V9H10z"/></svg></button>
    <h1 id="title">Block Quest</h1>
    <button class="ibtn" id="hear" type="button" aria-label="Hear the question" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h18v12H9l-5 4v-4H3z"/><path fill="none" stroke="#1e1a2e" stroke-width="2" stroke-linecap="round" d="M7 8.5h10M7 12h6"/></svg></button>
    <button class="ibtn" id="sound" type="button" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <a class="ibtn" href="../" aria-label="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></a>
  </header>

  <section class="screen" id="mapScreen">
    <div class="col">
      <div class="hero">
        <span id="pipHero"></span>
        <h2>Block Quest</h2>
        <p>Help Pip dig, craft, farm, build and trade. Every puzzle needs a plan!</p>
        <p class="whoami" id="whoami"></p>
      </div>
      <div class="areas" id="areas"></div>
      <div class="ground"></div>
    </div>
  </section>

  <section class="screen" id="levelScreen" hidden>
    <div class="col">
      <p class="q" id="areaBlurb"></p>
      <div class="levels" id="levels"></div>
    </div>
  </section>

  <section class="screen" id="playScreen" hidden>
    <div class="col" id="play">
      <h2 class="q" id="q"></h2>
      <div class="status" id="status"></div>
      <div id="stage" class="col"></div>
      <div class="msg" id="msg" aria-live="polite"></div>

    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div id="winArt"></div>
    <h2 id="winTitle">Level complete!</h2>
    <p id="winText"></p>
    <div class="row" id="winBtns"></div>
  </div>
</div>

<script src="../shared/profiles.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // seeded random numbers, so a level is the same layout every time you retry it
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const shuffleWith = (r, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- sound and speech ----------
  let audio = null, soundOn = true;
  function wake() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) { audio = null; } }
  addEventListener('pointerdown', wake, { once: true });
  function beep(freq, dur = .1, type = 'square', vol = .06) {
    if (!soundOn || !audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audio.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + dur);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + dur);
  }
  const tune = (notes, gap = 100, type = 'triangle') => notes.forEach((f, i) => setTimeout(() => beep(f, .16, type, .14), i * gap));
  let speech = '';
  function say(text, force) {
    if (!force && !soundOn) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = .92; u.pitch = 1.1; speechSynthesis.speak(u); } catch (_) {}
  }
  $('sound').addEventListener('click', () => {
    soundOn = !soundOn;
    $('sound').setAttribute('aria-pressed', soundOn);
    $('sound').setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
    if (!soundOn) try { speechSynthesis.cancel(); } catch (_) {}
  });
  $('hear').addEventListener('click', () => say(speech, true));

  // ---------- pixel art (all original) ----------
  function px(rows, pal, cls = '') {
    const h = rows.length, w = rows[0].length;
    let r = '';
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pal[ch]}"/>`; }));
    return `<svg class="${cls}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
  }
  const PIP = px([
    '..yyyy..',
    '.yyllyy.',
    'oyyyyyyo',
    '.ffffff.',
    '.fkffkf.',
    '.ffffff.',
    '.ffmmff.',
    '.ffffff.'
  ], { y: '#ffd23f', l: '#fff7c2', o: '#b7791f', f: '#7fd1ae', k: '#1e1a2e', m: '#2f7d62' });
  const GEM = px([
    '........',
    '..pppp..',
    '.pqqrqp.',
    'pqqrrqqp',
    '.pqqqqp.',
    '..pqqp..',
    '...pp...',
    '........'
  ], { p: '#a8288c', q: '#f472d0', r: '#ffd1f0' });
  const STAR_ON = px(['....y....', '...yyy...', 'yyyyyyyyy', '.yyyyyyy.', '..yyyyy..', '.yyy.yyy.', '.yy...yy.'], { y: '#ffd23f' });
  const STAR_OFF = px(['....y....', '...yyy...', 'yyyyyyyyy', '.yyyyyyy.', '..yyyyy..', '.yyy.yyy.', '.yy...yy.'], { y: 'rgba(255,255,255,.25)' });
  const PICK_ICON = px([
    '.ssss...',
    's....s..',
    '...h..s.',
    '..h....s',
    '.h......',
    'h.......'
  ], { s: '#b7c0cc', h: '#9c6b36' });
  const CROP_DRY = px(['........', '........', '........', '...d....', '..dd.d..', '...d.d..', '...dd...', '....d...'], { d: '#9c6b36' });
  const CROP_WET = px(['...y.y..', '..yyy.y.', '...yyy..', '.g.g.g..', '..gg.g..', '...g.g..', '...gg...', '....g...'], { y: '#ffd23f', g: '#5fb34a' });
  const FIRE = px(['....o...', '...oy...', '..oyyo..', '..oyyo..', '.oyyyyo.', '..oyyo..', 'bbbbbbbb', '.b.bb.b.'], { o: '#ff7a1a', y: '#ffd84d', b: '#6e4426' });
  const FIRE_OUT = px(['........', '...g....', '....g...', '...g....', '........', '........', 'bbbbbbbb', '.b.bb.b.'], { g: '#9aa0a6', b: '#4a3020' });
  const SPRING = px(['.wwwwww.', 'wbbbbbbw', 'wbwbbwbw', 'wbbbbbbw', '.wwwwww.', '..bbbb..', '...bb...', '...bb...'], { w: '#2a6fc9', b: '#5fb0ff' });
  const LOCK = px(['..kkkk..', '.k....k.', '.k....k.', 'kkkkkkkk', 'kyyyyyyk', 'kyykkyyk', 'kyyyyyyk', 'kkkkkkkk'], { k: '#1e1a2e', y: '#ffd23f' }, 'lock');
  const TROPHY = px([
    'kkkkkkkkkk',
    'kyyyyyyyyk',
    'yyyyppyyyy',
    'y.yyppyy.y',
    '.yyyyyyyy.',
    '..yyyyyy..',
    '...yyyy...',
    '....yy....',
    '...kyyk...',
    '..yyyyyy..'
  ], { k: '#b7791f', y: '#ffd23f', p: '#f472d0' }, 'trophy');

  const YARD_ICON = px(['....tt....', '..ttttff..', 'ttttffffff', 'bbttffffss', 'bbbbffssss', 'bbbbbsssss', 'bbbbbsssss', '.bbbbssss.', '...bbss...'], { t: '#f4e3b5', f: '#f4e3b5', b: '#5aa6f0', s: '#ff9f43' });
  const COIN_ICON = px(['..yyyy..', '.yooooy.', 'yoyyyyoy', 'yoyooyoy', 'yoyyyyoy', '.yooooy.', '..yyyy..', '........'], { y: '#ffd23f', o: '#d9a520' });
  // ---------- block textures (drawn at load, 16x16, pixelated) ----------
  function tex(draw) { const c = document.createElement('canvas'); c.width = c.height = 16; draw(c.getContext('2d'), rng(draw.length * 7919 + 17)); return c.toDataURL(); }
  function speck(g, r, base, cols, n) { g.fillStyle = base; g.fillRect(0, 0, 16, 16); for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(Math.floor(r() * 16), Math.floor(r() * 16), r() < .3 ? 2 : 1, 1); } }
  const T = {
    dirt: tex((g, r) => speck(g, r, '#8a5a34', ['#6e4426', '#a7744a', '#5c381f'], 70)),
    grass: tex((g, r) => { speck(g, r, '#8a5a34', ['#6e4426', '#a7744a', '#5c381f'], 50); g.fillStyle = '#5fb34a'; g.fillRect(0, 0, 16, 4); for (let x = 0; x < 16; x++) { const d = Math.floor(r() * 3); g.fillRect(x, 4, 1, d); } g.fillStyle = '#86d965'; for (let i = 0; i < 10; i++) g.fillRect(Math.floor(r() * 16), Math.floor(r() * 3), 1, 1); }),
    stone: tex((g, r) => { speck(g, r, '#8d939b', ['#767c84', '#a3a9b1', '#6a7078'], 80); }),
    hard: tex((g, r) => { speck(g, r, '#4b4f63', ['#3b3e4f', '#5d6177', '#34364a'], 70); g.fillStyle = '#25273a'; [[2, 3], [3, 4], [4, 4], [5, 5], [10, 9], [11, 10], [11, 11], [12, 12], [7, 12], [8, 13]].forEach(([x, y]) => g.fillRect(x, y, 1, 1)); }),
    metal: tex((g, r) => { g.fillStyle = '#8f96a3'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#c7ccd6'; g.fillRect(1, 1, 14, 14); g.fillStyle = '#dfe3ea'; g.fillRect(2, 2, 12, 5); g.fillStyle = '#6f7684'; [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => g.fillRect(x, y, 1, 1)); g.fillRect(1, 8, 14, 1); }),
    lava: tex((g, r) => { g.fillStyle = '#e8551c'; g.fillRect(0, 0, 16, 16); for (let i = 0; i < 14; i++) { g.fillStyle = ['#ffb02e', '#ffd84d', '#b8360f'][i % 3]; g.fillRect(Math.floor(r() * 15), Math.floor(r() * 15), 2 + Math.floor(r() * 2), 1 + Math.floor(r() * 2)); } }),
    tunnel: tex((g, r) => speck(g, r, '#2b1d14', ['#24180f', '#352419'], 40)),
    plank: tex((g, r) => { speck(g, r, '#c08a4e', ['#b07a40', '#cf9a5e'], 40); g.fillStyle = '#8e5f2e'; [3, 7, 11, 15].forEach(y => g.fillRect(0, y, 16, 1)); g.fillRect(5, 0, 1, 3); g.fillRect(11, 4, 1, 3); g.fillRect(3, 8, 1, 3); g.fillRect(13, 12, 1, 3); }),
    stoneBlock: tex((g, r) => { speck(g, r, '#8d939b', ['#767c84', '#a3a9b1'], 50); g.fillStyle = '#5f646c'; g.fillRect(0, 7, 16, 1); g.fillRect(7, 0, 1, 7); g.fillRect(3, 8, 1, 8); g.fillRect(12, 8, 1, 8); }),
    iron: tex((g, r) => { g.fillStyle = '#aeb6c2'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#eef1f5'; g.fillRect(1, 1, 14, 14); g.fillStyle = '#d3d8e0'; for (let y = 3; y < 15; y += 4) g.fillRect(1, y, 14, 1); g.fillStyle = '#ffffff'; g.fillRect(2, 2, 5, 1); }),
    gem: tex((g, r) => { g.fillStyle = '#a8288c'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#d94bb5'; g.fillRect(1, 1, 14, 14); g.fillStyle = '#f472d0'; g.fillRect(3, 3, 10, 10); g.fillStyle = '#ffd1f0'; g.fillRect(4, 4, 3, 2); g.fillRect(4, 6, 1, 2); }),
    farm: tex((g, r) => { speck(g, r, '#6b4423', ['#553419', '#7c5230'], 40); g.fillStyle = '#4a2e15'; for (let x = 1; x < 16; x += 4) g.fillRect(x, 0, 1, 16); g.fillStyle = '#5fb34a'; g.fillRect(0, 0, 16, 2); }),
    water: tex((g, r) => { g.fillStyle = '#3a8ee6'; g.fillRect(0, 0, 16, 16); g.fillStyle = '#5fb0ff'; for (let i = 0; i < 8; i++) g.fillRect(Math.floor(r() * 12), Math.floor(r() * 16), 3 + Math.floor(r() * 3), 1); }),
    crack: tex((g, r) => { g.clearRect(0, 0, 16, 16); g.fillStyle = 'rgba(0,0,0,.75)'; [[7, 2], [7, 3], [8, 4], [8, 5], [7, 6], [6, 7], [5, 8], [9, 6], [10, 7], [11, 8], [8, 7], [8, 8], [9, 9], [9, 10], [4, 9], [12, 9]].forEach(([x, y]) => g.fillRect(x, y, 1, 1)); }),
    stick: null
  };
  const root = document.documentElement.style;
  for (const [k, v] of Object.entries(T)) if (v) root.setProperty('--t-' + k, `url(${v})`);

  // ---------- saving ----------
  // progress belongs to whoever is playing (see shared/profiles.js)
  let save = { mines: [], hut: [], farm: [], yard: [], market: [], endless: {}, minesV: 2 };
  {
    const old = KBG.get('blockquest', {});
    if (old.minesV !== 2) delete old.mines;   // the mines were rebuilt harder, so start them fresh
    save = Object.assign(save, old, { minesV: 2 });
  }
  const persist = () => {
    KBG.set('blockquest', save);
    const areas = ['mines', 'hut', 'farm', 'yard', 'market'];
    KBG.setBest('blockquest', {
      stars: areas.reduce((t, a) => t + save[a].reduce((s, v) => s + (v || 0), 0), 0),
      levels: areas.reduce((t, a) => t + save[a].filter(Boolean).length, 0),
      endless: Object.values(save.endless).reduce((t, v) => t + v, 0)
    });
  };

  // ---------- screens ----------
  const AREAS = {
    mines: { name: 'Gem Mines', blurb: 'Collect every gem before your pickaxe runs out. Pick the best order!', count: 10, art: 'stone', icon: GEM, build: buildDig },
    hut: { name: 'Crafting Hut', blurb: 'Work out the recipe and craft the tool.', count: 10, art: 'plank', icon: null, build: buildCraft },
    farm: { name: 'Farm Fields', blurb: 'Place blocks to send the water to the crops.', count: 8, art: 'farm', icon: CROP_WET, build: buildWater },
    yard: { name: "Builder's Yard", blurb: 'Build it from how it looks from the front, side and top.', count: 10, art: 'stoneBlock', icon: YARD_ICON, build: buildYard },
    market: { name: 'Village Market', blurb: 'Trade step by step to get what you need. Watch out for traps!', count: 10, art: 'grass', icon: COIN_ICON, build: buildMarket }
  };
  let current = null;   // { area, lv }
  const screens = ['mapScreen', 'levelScreen', 'playScreen'];
  function showScreen(id) { screens.forEach(s => $(s).hidden = s !== id); $(id).scrollTop = 0; }
  const starsHtml = n => [0, 1, 2].map(i => i < n ? STAR_ON : STAR_OFF).join('');
  const total = a => save[a].reduce((s, v) => s + (v || 0), 0);

  function showMap() {
    current = null;
    document.body.className = '';
    $('title').textContent = 'Block Quest';
    $('back').hidden = true; $('hear').hidden = true;
    $('pipHero').innerHTML = PIP.replace('<svg', '<svg class="pip-hero"');
    const me = KBG.current();
    $('whoami').innerHTML = KBG.avatarSvg(me.avatar) + '<span></span><a href="../">Change</a>';
    $('whoami').querySelector('span').textContent = 'Playing as ' + me.name + ' ·';
    const wrap = $('areas'); wrap.innerHTML = '';
    for (const [key, a] of Object.entries(AREAS)) {
      const done = save[key].filter(Boolean).length;
      const b = el('button', 'area');
      b.type = 'button';
      const icon = a.icon || craftIcon('pickaxe', 'gem');
      b.innerHTML = `<div class="art" style="background-image:var(--t-${a.art})">${icon}</div>
        <div><b>${a.name}</b><span>${a.blurb}</span>
        <div class="prog">${STAR_ON}<span>${total(key)} / ${a.count * 3}</span><span>&middot; ${done} of ${a.count} levels</span></div></div>`;
      b.addEventListener('click', () => { beep(523, .08); showLevels(key); });
      wrap.appendChild(b);
    }
    showScreen('mapScreen');
  }

  function showLevels(key) {
    const a = AREAS[key];
    current = { area: key, lv: null };
    document.body.className = key;
    $('title').textContent = a.name;
    $('back').hidden = false; $('hear').hidden = true;
    $('areaBlurb').textContent = a.blurb;
    const wrap = $('levels'); wrap.innerHTML = '';
    const firstOpen = save[key].filter(Boolean).length;
    for (let i = 0; i < a.count; i++) {
      const got = save[key][i] || 0;
      const open = i <= firstOpen;
      const b = el('button', 'lvl' + (i === firstOpen ? ' next' : ''));
      b.type = 'button'; b.disabled = !open;
      b.setAttribute('aria-label', 'Level ' + (i + 1) + (open ? ', ' + got + ' stars' : ', locked'));
      b.innerHTML = open ? `<span>${i + 1}</span><span class="stars">${starsHtml(got)}</span>` : LOCK;
      b.addEventListener('click', () => startLevel(key, i));
      wrap.appendChild(b);
    }
    const finished = save[key].filter(Boolean).length >= a.count;
    const e = el('button', 'lvl endless');
    e.type = 'button'; e.disabled = !finished;
    const solved = save.endless[key] || 0;
    e.innerHTML = finished ? `<span class="inf">&infin;</span><span class="small">${solved} solved</span>` : LOCK + '<span class="small">Endless</span>';
    e.setAttribute('aria-label', finished ? 'Endless puzzles, ' + solved + ' solved' : 'Endless puzzles, locked until every level is done');
    e.addEventListener('click', () => startEndless(key));
    wrap.appendChild(e);
    $('areaBlurb').textContent = a.blurb + (firstOpen > 0 ? ' Replay a level for a brand-new puzzle!' : '');
    showScreen('levelScreen');
  }

  let cleanup = null;
  // The first time you play a level you get the hand-picked version (variant 0).
  // Replays and Endless get a fresh puzzle at the same difficulty; "try again" keeps the same one.
  const freshVariant = () => 1 + Math.floor(Math.random() * 1e6);
  function startLevel(key, lv, opts = {}) {
    if (cleanup) { cleanup(); cleanup = null; }
    const variant = opts.variant ?? (opts.endless || save[key][lv] ? freshVariant() : 0);
    current = { area: key, lv, variant, endless: !!opts.endless };
    document.body.className = key;
    $('title').textContent = AREAS[key].name + ' · ' + (opts.endless ? 'Endless' : lv + 1);
    $('back').hidden = false; $('hear').hidden = false;
    $('stage').innerHTML = ''; $('status').innerHTML = ''; $('actions').innerHTML = ''; $('msg').textContent = '';
    showScreen('playScreen');
    AREAS[key].build(lv, variant);
    setTimeout(() => say(speech), 350);
  }

  function startEndless(key) {
    const n = AREAS[key].count;
    startLevel(key, n - 3 + Math.floor(Math.random() * 3), { endless: true });   // the hardest few levels, new every time
  }

  function setQ(text, spoken) { $('q').textContent = text; speech = spoken || text; }
  function msg(text, speak = true) { $('msg').textContent = text; if (speak && text) say(text); }
  function action(label, fn, cls = '', icon = '') {
    const b = el('button', 'btn ' + cls, icon + `<span>${label}</span>`);
    b.type = 'button'; b.addEventListener('click', fn);
    $('actions').appendChild(b); return b;
  }

  function win(stars, text) {
    const { area, lv, variant, endless } = current;
    const a = AREAS[area];
    const btns = $('winBtns'); btns.innerHTML = '';
    const close = () => { $('overlay').hidden = true; };
    const mk = (label, fn, cls) => { const b = el('button', 'btn ' + (cls || ''), label); b.type = 'button'; b.addEventListener('click', () => { close(); fn(); }); btns.appendChild(b); return b; };
    if (endless) {
      save.endless[area] = (save.endless[area] || 0) + 1;
      persist();
      tune([523, 659, 784, 1047]);
      $('winArt').innerHTML = `<div class="bigstars">${starsHtml(stars)}</div>`;
      $('winTitle').textContent = 'Solved!';
      $('winText').textContent = (text ? text + ' ' : '') + 'Endless puzzles solved: ' + save.endless[area] + '.';
      mk('Back', () => showLevels(area), 'alt');
      const nx = mk('Next puzzle', () => startEndless(area));
      $('overlay').hidden = false; nx.focus();
      say('Solved! ' + (text || '') + ' That makes ' + save.endless[area] + ' endless puzzles.');
      return;
    }
    save[area][lv] = Math.max(save[area][lv] || 0, stars);
    persist();
    KBG.record('blockquest-levels', { stars }, { total: true });
    const areaDone = save[area].filter(Boolean).length === a.count && lv === a.count - 1;
    tune(stars === 3 ? [523, 659, 784, 1047, 1319] : [523, 659, 784, 1047]);
    $('winArt').innerHTML = areaDone ? TROPHY : `<div class="bigstars">${starsHtml(stars)}</div>`;
    $('winTitle').textContent = areaDone ? 'You finished ' + a.name + '!' : stars === 3 ? 'Perfect!' : 'Level complete!';
    $('winText').textContent = text || '';
    if (stars < 3) mk('Try for 3 stars', () => startLevel(area, lv, { variant }), 'alt');
    mk('New puzzle', () => startLevel(area, lv, { variant: freshVariant() }), 'alt');
    let first;
    if (lv + 1 < a.count) first = mk('Next level', () => startLevel(area, lv + 1));
    else first = mk('Back to map', showMap);
    $('overlay').hidden = false; first.focus();
    say((areaDone ? 'You finished ' + a.name + '! ' : '') + (stars === 3 ? 'Perfect! Three stars!' : stars + (stars === 1 ? ' star!' : ' stars!')) + ' ' + (text || ''));
  }

  $('back').addEventListener('click', () => {
    if (cleanup) { cleanup(); cleanup = null; }
    try { speechSynthesis.cancel(); } catch (_) {}
    if (current && current.lv != null) showLevels(current.area); else showMap();
  });

  // ======================================================================
  // 1. GEM MINES: collect every gem with a limited pickaxe. Dirt 1 hit, stone 2, hard rock 3;
  // lava and metal can't be dug. With several gems, the order matters and tunnels can be reused.
  // ======================================================================
  const HITS = { G: 1, D: 1, S: 2, H: 3, E: 0, A: 0 };
  const DIG_TEX = { A: 't-sky', E: 't-tunnel', G: 't-grass', D: 't-dirt', S: 't-stone', H: 't-hard', L: 't-lava', M: 't-metal' };
  const passable = t => t in HITS;
  function dijkstra(grid, W, H, from, hitsLeft) {
    const N = W * H, dist = Array(N).fill(Infinity), prev = Array(N).fill(-1), done = Array(N).fill(false);
    const id = (x, y) => y * W + x;
    dist[id(...from)] = 0;
    for (;;) {
      let u = -1, best = Infinity;
      for (let i = 0; i < N; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
      if (u < 0) break;
      done[u] = true;
      const ux = u % W, uy = Math.floor(u / W);
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const x = ux + dx, y = uy + dy;
        if (x < 0 || y < 0 || x >= W || y >= H) continue;
        const t = grid[y][x]; if (!passable(t)) continue;
        const c = hitsLeft ? hitsLeft[y][x] : HITS[t];
        const v = id(x, y);
        if (dist[u] + c < dist[v]) { dist[v] = dist[u] + c; prev[v] = u; }
      }
    }
    return { dist, prev, id };
  }
  const perms = a => a.length <= 1 ? [a] : a.flatMap((v, i) => perms([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [v, ...p]));
  // Cost of visiting gems in a given order, reusing tunnels already dug on the way.
  function routeCost(grid, W, H, hits, from, order) {
    const h = hits.map(r => r.slice());
    let p = from, cost = 0, firstPath = null;
    for (const g of order) {
      const d = dijkstra(grid, W, H, p, h);
      const c = d.dist[d.id(...g)];
      if (!isFinite(c)) return { cost: Infinity };
      cost += c;
      const cells = []; let v = d.prev[d.id(...g)];
      while (v >= 0 && v !== d.id(...p)) { cells.push(v); v = d.prev[v]; }
      cells.push(d.id(...g));
      if (!firstPath) firstPath = cells;
      cells.forEach(i => { h[Math.floor(i / W)][i % W] = 0; });
      p = g;
    }
    return { cost, firstPath };
  }
  function bestRoute(grid, W, H, hits, from, gems) {
    let best = { cost: Infinity };
    for (const order of perms(gems)) { const r = routeCost(grid, W, H, hits, from, order); if (r.cost < best.cost) best = { ...r, order }; }
    return best;
  }
  function makeDig(lv, variant = 0) {
    const W = 8, H = 6 + Math.min(2, Math.floor(lv / 4));
    const nGems = lv <= 1 ? 1 : lv <= 5 ? 2 : 3;
    const slack = lv <= 2 ? 2 : lv <= 5 ? 1 : 0;
    for (let seed = 0; seed < 3000; seed++) {
      const r = rng(2000 + lv * 131 + seed * 17 + variant * 7919);
      const stoneP = .3 + lv * .02, hardP = .12 + lv * .03;
      const grid = [];
      for (let y = 0; y < H; y++) {
        const row = [];
        for (let x = 0; x < W; x++) {
          if (y === 0) row.push('A');
          else if (y === 1) row.push(r() < .35 ? 'S' : 'G');
          else { const v = r(); row.push(v < hardP ? 'H' : v < hardP + stoneP ? 'S' : 'D'); }
        }
        grid.push(row);
      }
      const put = (t, n) => { for (let i = 0; i < n; i++) { const x = Math.floor(r() * W), y = 2 + Math.floor(r() * (H - 2)); grid[y][x] = t; } };
      put('L', 1 + Math.floor(lv / 2));
      put('M', Math.floor(lv / 2));
      const start = [Math.floor(r() * W), 0];
      const gems = [];
      for (let tries = 0; gems.length < nGems && tries < 50; tries++) {
        const g = [Math.floor(r() * W), 2 + Math.floor(r() * (H - 2))];
        if (gems.some(o => Math.abs(o[0] - g[0]) + Math.abs(o[1] - g[1]) < 3)) continue;
        if (Math.abs(g[0] - start[0]) + g[1] < 4) continue;
        gems.push(g);
      }
      if (gems.length < nGems) continue;
      gems.forEach(([x, y]) => grid[y][x] = 'E');
      const hits = grid.map(row => row.map(t => HITS[t] ?? 0));
      const best = bestRoute(grid, W, H, hits, start, gems);
      if (!isFinite(best.cost) || best.cost < 4 + lv) continue;
      if (nGems === 1) {
        // straight down then across must not already be the cheapest
        const g = gems[0];
        let naive = 0;
        for (let y = 1; y <= g[1]; y++) { const t = grid[y][start[0]]; naive += passable(t) ? HITS[t] : Infinity; }
        const dir = Math.sign(g[0] - start[0]);
        for (let x = start[0] + dir; dir && x !== g[0] + dir; x += dir) { const t = grid[g[1]][x]; naive += passable(t) ? HITS[t] : Infinity; }
        if (naive < best.cost + 3) continue;
      } else {
        // the order must matter, and grabbing the nearest gem first must not be the best plan
        const costs = perms(gems).map(o => routeCost(grid, W, H, hits, start, o).cost).filter(isFinite);
        if (Math.max(...costs) - best.cost < 3) continue;
        let p = start, h = hits.map(r => r.slice()), greedy = 0, left = gems.slice();
        while (left.length) {
          const d = dijkstra(grid, W, H, p, h);
          left.sort((a, b) => d.dist[d.id(...a)] - d.dist[d.id(...b)]);
          const r2 = routeCost(grid, W, H, h, p, [left[0]]);
          if (!isFinite(r2.cost)) { greedy = Infinity; break; }
          greedy += r2.cost; r2.firstPath.forEach(i => h[Math.floor(i / W)][i % W] = 0);
          p = left.shift();
        }
        if (lv >= 4 && greedy <= best.cost && seed < 2500) continue;
      }
      return { W, H, grid, start, gems, target: best.cost, energy: best.cost + slack, slack };
    }
    throw new Error('no dig level ' + lv);
  }

  function buildDig(lv, variant = 0) {
    let L;
    try { L = makeDig(lv, variant); } catch (_) { L = makeDig(lv, 0); }
    window.__bq.cur = L;
    const { W, H, target } = L;
    let grid, hits, pos, energy, used, hinted, path, busy, left;
    const board = el('div', 'board');
    board.style.setProperty('--cols', W); board.style.setProperty('--rows', H);
    $('stage').appendChild(board);
    const cells = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const c = el('button', 'cell'); c.type = 'button';
      c.addEventListener('click', () => tap(x, y));
      board.appendChild(c); cells.push(c);
    }
    const energyChip = el('div', 'chip'), gemChip = el('div', 'chip');
    $('status').append(energyChip, gemChip);
    const many = L.gems.length > 1;
    const exact = L.slack === 0;
    setQ(many ? 'Collect all ' + L.gems.length + ' gems!' : lv === 0 ? 'Dig down to the gem!' : 'Find the cheapest way to the gem!',
      (many ? 'Collect all ' + L.gems.length + ' gems. Think about which gem to get first, because tunnels you have already dug are free to walk back through. ' : 'Dig to the pink gem. ')
      + 'Dirt takes 1 hit, grey stone takes 2, dark rock takes 3. Lava and metal can not be dug.'
      + (exact ? ' You only have exactly enough hits for the best plan, so plan before you dig!' : ''));
    action('Start again', reset, 'alt');
    action('Hint', hint);

    function reset() {
      grid = L.grid.map(r => r.slice());
      hits = grid.map(r => r.map(t => HITS[t] ?? 0));
      pos = L.start.slice(); energy = L.energy; used = 0; hinted = false; path = null; busy = false;
      left = L.gems.map(g => g.slice());
      msg(exact ? 'You have exactly enough hits. Plan first!' : '', false); draw();
    }
    const isGem = (x, y) => left.some(g => g[0] === x && g[1] === y);
    function draw() {
      cells.forEach((c, i) => {
        const x = i % W, y = Math.floor(i / W), t = grid[y][x];
        c.className = 'cell ' + DIG_TEX[t] + (t !== 'A' && t !== 'E' && passable(t) && hits[y][x] < HITS[t] ? ' crack' : '') + (path && path.has(i) ? ' dot' : '');
        let inner = '';
        if (x === pos[0] && y === pos[1]) inner = PIP;
        else if (isGem(x, y)) inner = GEM;
        if (passable(t) && hits[y][x] > 0) inner += `<span class="pips">${'<i></i>'.repeat(hits[y][x])}</span>`;
        c.innerHTML = inner;
        const name = { A: 'sky', E: 'tunnel', G: 'grass', D: 'dirt', S: 'stone', H: 'hard rock', L: 'lava', M: 'metal' }[t];
        c.setAttribute('aria-label', (x === pos[0] && y === pos[1]) ? 'Pip' : isGem(x, y) ? 'gem' : name + (hits[y][x] ? ', ' + hits[y][x] + ' hits' : ''));
      });
      energyChip.innerHTML = PICK_ICON + `<span>${energy} hits left</span>`;
      energyChip.classList.toggle('low', energy <= 2);
      gemChip.innerHTML = GEM + `<span>${L.gems.length - left.length} of ${L.gems.length}</span>`;
    }
    function tap(x, y) {
      if (busy) return;
      const dx = Math.abs(x - pos[0]), dy = Math.abs(y - pos[1]);
      if (dx + dy === 0) return;
      if (dx + dy !== 1) { msg('Pip can only dig next to where Pip is standing.'); beep(150, .1); return; }
      const t = grid[y][x], c = cells[y * W + x];
      if (t === 'L') { msg('Too hot! Lava can\'t be dug. Find another way.'); beep(120, .2); return; }
      if (t === 'M') { msg('Too strong! Metal can\'t be dug. Find another way.'); beep(120, .2); return; }
      path = null;
      if (hits[y][x] > 0) {
        if (energy <= 0) return;
        hits[y][x]--; energy--; used++;
        c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit');
        beep(hits[y][x] ? 220 : 330, .07, 'square', .07);
        if (hits[y][x] === 0) grid[y][x] = y === 0 ? 'A' : 'E';
        else { draw(); checkStuck(); return; }
      }
      pos = [x, y]; beep(440, .04, 'sine', .05);
      if (isGem(x, y)) {
        left = left.filter(g => !(g[0] === x && g[1] === y));
        tune([988, 1319], 80, 'sine');
      }
      msg('', false); draw();
      if (!left.length) {
        busy = true;
        let stars = used <= target ? 3 : used <= target + 2 ? 2 : 1;
        if (hinted) stars = Math.min(2, stars);
        setTimeout(() => win(stars, used < target ? 'Wow, only ' + used + ' hits! That beats our best plan of ' + target + '!'
          : used === target ? 'Only ' + used + ' hits. A perfect plan!' : 'You used ' + used + ' hits. The best plan uses ' + target + '.'), 350);

    function checkStuck() {
      const plan = bestRoute(grid, W, H, hits, pos, left);

    function hint() {
      if (busy) return;

      path = new Set(plan.firstPath); hinted = true; draw();
      msg('Follow the yellow dots to the next gem. Hints make the most stars 2.');
    }
    const onKey = e => {
      const m = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
      if (!m || !$('overlay').hidden) return;
      e.preventDefault();
      const x = pos[0] + m[0], y = pos[1] + m[1];
      if (x >= 0 && y >= 0 && x < W && y < H) tap(x, y);

    addEventListener('keydown', onKey);

  }

  // ======================================================================
  // 2. CRAFTING HUT: copy a recipe, read the tool's shape, then work out new recipes from examples.
  // ======================================================================
  const SHAPES = {
    pickaxe: ['MMM', '.S.', '.S.'],
    axe: ['MM.', 'MS.', '.S.'],
    shovel: ['.M.', '.S.', '.S.'],
    sword: ['.M.', '.M.', '.S.'],
    hoe: ['MM.', '.S.', '.S.']
  };
  const ICON_SHAPES = {
    pickaxe: ['.hhhhh.', 'h..s..h', '...s...', '...s...', '...s...', '...s...'],
    axe: ['.hhh...', 'hhhs...', 'hhhs...', '.h.s...', '...s...', '...s...'],
    shovel: ['..hhh..', '..hhh..', '..hhh..', '...s...', '...s...', '...s...'],
    sword: ['...h...', '..hhh..', '..hhh..', '..hhh..', '...s...', '...s...'],
    hoe: ['hhhh...', 'h..s...', '...s...', '...s...', '...s...', '...s...']
  };
  const MATS = {
    wood: { name: 'Wooden', label: 'wood', color: '#c08a4e', tex: 'plank' },
    stone: { name: 'Stone', label: 'stone', color: '#9aa0a6', tex: 'stoneBlock' },
    iron: { name: 'Iron', label: 'iron', color: '#e6e8ec', tex: 'iron' },
    gem: { name: 'Gem', label: 'gem', color: '#f472d0', tex: 'gem' }
  };
  const STICK_SVG = px(['......ss', '.....ss.', '....ss..', '...ss...', '..ss....', '.ss.....', 'ss......', 's.......'], { s: '#9c6b36' });
  function craftIcon(shape, mat) { return px(ICON_SHAPES[shape], { h: MATS[mat].color, s: '#7a5230' }); }
  const itemName = (shape, mat) => MATS[mat].name + ' ' + shape;
  const pieceHtml = p => p === 'stick' ? STICK_SVG : '';
  const pieceBg = p => p && p !== 'stick' ? `background-image:var(--t-${MATS[p].tex})` : '';
  const recipeOf = (shape, mat) => SHAPES[shape].map(r => [...r].map(ch => ch === 'M' ? mat : ch === 'S' ? 'stick' : null));

  function makeCraft(lv, variant = 0) {
    const r = rng(5000 + lv * 31 + variant * 7919);
    const shapes = Object.keys(SHAPES), mats = Object.keys(MATS);
    if (variant && lv <= 3) {
      // a fresh tool and material, same kind of puzzle
      const shape = shapes[Math.floor(r() * shapes.length)], mat = mats[Math.floor(r() * mats.length)];
      const extra = shuffleWith(r, mats.filter(m => m !== mat)).slice(0, lv <= 1 ? lv : 2);
      return { mode: lv <= 1 ? 'copy' : 'look', shape, mat, examples: [], palette: shuffleWith(r, [mat, ...extra]).concat('stick'), prefill: lv === 2 };
    }
    if (lv <= 1) return { mode: 'copy', shape: ['shovel', 'pickaxe'][lv], mat: ['wood', 'stone'][lv], examples: [], palette: lv === 0 ? ['wood', 'stick'] : ['stone', 'wood', 'stick'] };
    if (lv <= 3) return { mode: 'look', shape: ['sword', 'axe'][lv - 2], mat: ['iron', 'gem'][lv - 2], examples: [], palette: ['iron', 'gem', 'stone', 'stick'], prefill: lv === 2 };
    const shape = shapes[Math.floor(r() * shapes.length)];
    const mat = mats[Math.floor(r() * mats.length)];
    const otherMat = shuffleWith(r, mats.filter(m => m !== mat))[0];
    const otherShape = shuffleWith(r, shapes.filter(s => s !== shape))[0];
    let examples;
    if (lv <= 5) examples = [[shape, otherMat], [otherShape, mat]];          // shape from one, material from the other
    else {
      const third = shuffleWith(r, shapes.filter(s => s !== shape && s !== otherShape))[0];
      const thirdMat = shuffleWith(r, mats.filter(m => m !== mat && m !== otherMat))[0];
      examples = shuffleWith(r, [[shape, otherMat], [otherShape, mat], [third, thirdMat]]);   // one example is a distraction
    }
    return { mode: 'detective', shape, mat, examples, palette: lv <= 5 ? [mat, otherMat, 'stick'] : [...mats, 'stick'] };
  }

  function recipeCard(shape, mat, opts = {}) {
    const card = el('div', 'card' + (opts.goal ? ' goal' : ''));
    const mini = el('div', 'mini');
    recipeOf(shape, mat).flat().forEach(p => {
      const i = el('i'); if (opts.hidden) i.textContent = '?';
      else { i.style.cssText = pieceBg(p); i.innerHTML = pieceHtml(p); }
      mini.appendChild(i);
    });
    const out = el('div', 'out', craftIcon(shape, mat) + `<span class="name">${itemName(shape, mat)}</span>`);
    card.append(mini, el('span', 'arrow', '&#8594;'), out);
    return card;
  }

  function buildCraft(lv, variant = 0) {
    const P = makeCraft(lv, variant);
    window.__bq.cur = P;
    const target = recipeOf(P.shape, P.mat);
    let grid, selected = P.palette[0], tries = 0, done = false;
    const name = itemName(P.shape, P.mat);
    if (P.mode === 'copy') setQ('Craft a ' + name + '!', 'Copy the recipe card. Pick a block, then tap the crafting table to place it. Make a ' + name + '.');
    else if (P.mode === 'look') setQ('Craft a ' + name + '!', 'There is no recipe card this time! Look at the picture of the ' + name + '. The recipe has the same shape as the tool.');
    else setQ('Work out the ' + name + ' recipe!', 'Look at the recipes you know. One shows the shape, one shows the material. Use them to craft a ' + name + '.');

    const cards = el('div', 'cards');
    if (P.mode === 'copy') cards.appendChild(recipeCard(P.shape, P.mat));
    P.examples.forEach(([s, m]) => cards.appendChild(recipeCard(s, m)));
    if (P.mode !== 'copy') cards.appendChild(recipeCard(P.shape, P.mat, { goal: true, hidden: true }));
    $('stage').appendChild(cards);

    const table = el('div', 'table');
    const slots = [];
    for (let i = 0; i < 9; i++) {
      const s = el('button', 'slot'); s.type = 'button';
      s.addEventListener('click', () => place(i));
      table.appendChild(s); slots.push(s);
    }
    $('stage').appendChild(table);

    const pal = el('div', 'palette');
    const palBtns = P.palette.map(p => {
      const b = el('button', 'pal'); b.type = 'button';
      b.setAttribute('aria-label', p === 'stick' ? 'stick' : MATS[p].label);
      b.innerHTML = `<i style="${pieceBg(p)}">${pieceHtml(p)}</i>`;
      b.addEventListener('click', () => { selected = p; drawPal(); beep(660, .05, 'sine', .08); });
      pal.appendChild(b); return b;
    });
    $('stage').appendChild(pal);
    function drawPal() { palBtns.forEach((b, i) => b.setAttribute('aria-pressed', P.palette[i] === selected)); }

    const locked = new Set();
    function reset() {
      grid = Array(9).fill(null); locked.clear();
      if (P.prefill) target.flat().forEach((p, i) => { if (p === 'stick') { grid[i] = 'stick'; locked.add(i); } });
      draw(); msg('', false);
    }
    function draw(bad) {
      slots.forEach((s, i) => {
        s.style.cssText = pieceBg(grid[i]);
        s.innerHTML = pieceHtml(grid[i]);
        s.className = 'slot' + (locked.has(i) ? ' locked' : '') + (bad && bad.has(i) ? ' bad' : '');
        s.setAttribute('aria-label', 'Square ' + (i + 1) + ': ' + (grid[i] ? (grid[i] === 'stick' ? 'stick' : MATS[grid[i]].label) : 'empty'));
      });
    }
    function place(i) {
      if (done || locked.has(i)) return;
      grid[i] = grid[i] === selected ? null : selected;
      beep(grid[i] ? 392 : 262, .06, 'square', .06);
      draw();
    }
    action('Clear', reset, 'alt');
    action('Craft!', () => {
      if (done) return;
      const want = target.flat();
      const bad = new Set(); want.forEach((p, i) => { if ((grid[i] || null) !== p) bad.add(i); });
      if (!bad.size) {
        done = true;
        const stars = tries === 0 ? 3 : tries === 1 ? 2 : 1;
        $('stage').querySelector('.goal .mini')?.replaceWith(recipeCard(P.shape, P.mat).querySelector('.mini'));
        setTimeout(() => win(stars, 'You crafted a ' + name + '!'), 300);
        return;
      }
      tries++;
      beep(160, .25, 'sawtooth', .05);
      const n = bad.size;
      let m = 'Not yet! ' + n + (n === 1 ? ' square needs' : ' squares need') + ' changing.';
      if (P.mode === 'copy') m += ' Check the recipe card one square at a time.';
      else if (P.mode === 'look') m += ' The recipe looks just like the tool picture.';
      else m += ' Which recipe has the same shape? Which one has the same material?';
      if (tries >= 2) { draw(bad); m += ' The red squares are wrong.'; }
      msg(m);
    });
    drawPal(); reset();
  }

  // ======================================================================
  // 3. FARM FIELDS: water falls down, spreads sideways on solid ground, and pours off edges.
  // ======================================================================
  // Map key: S spring, . air, # rock, = farmland, c crop (needs water), f campfire (keep dry). Solved with a solver:
  // each level needs exactly the number of blocks it gives you.
  const WATER_LEVELS = [
    { k: 1, map: ['.S......', '.......c', '.###.##=', '........', '........', '........', '########'] },
    { k: 1, map: ['...S....', '........', '.f.....c', '#######=', '........', '........', '########'] },
    { k: 2, map: ['S.......', '........', '##.#.##c', '#######=', '........', '........', '########'] },
    { k: 2, map: ['......S.', '.......c', '.####..=', '.###..##', '...####.', '.c###.##', '#=######'] },
    { k: 2, map: ['.S......', '..c.....', '..=####.', '..###.##', '...###.#', 'c.f###.#', '=#######'] },
    { k: 3, map: ['S.......', '........', '........', '..####c#', '.##.##=.', '..c.ff..', '##=#####'] },
    { k: 3, map: ['...S....', 'c.......', '=####f.#', '.#####.#', '.....c..', '##c.#=##', '##=#####'] },
    { k: 3, map: ['S......S', '........', '.....cc.', 'ff##.==c', '#####.#=', '.###.###', '########'] }

  // Extra solver-checked maps for each level (same blocks needed, same hazards). Rows are joined with '/'.

    const rec = (start, chosen) => {
      if (sols.length > 20) return;

      for (let i = start; i < free.length; i++) { chosen.push(free[i]); rec(i + 1, chosen); chosen.pop(); }

  }

  function buildWater(lv, variant = 0) {

  // ======================================================================
  // 4. BUILDER'S YARD: build a block structure from how it looks from the front, side and top.
  // Front faces are blue, side faces are orange, so the 3D picture and the views match up.
  // ======================================================================
  const FACE = { top: '#f4e3b5', front: '#5aa6f0', side: '#ff9f43', edge: '#1e1a2e' };
  function viewsOf(h) {

  // fewest blocks that still match the front and side (and top, if given)
  function fewestBlocks(N, maxH, v, useTop) {

  // In the 3D picture, a tall stack in front can hide what's behind it. For "copy the picture" levels,
  // draw each square's top in its own colour and make sure enough of every one is visible.
  function allVisible(h, N, maxH) {

    const g = cv.getContext('2d', { willReadFrequently: true });

      for (let z = 0; z < h[y][x]; z++) {
        poly([P(x, y + 1, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], 'rgb(0,0,200)');
        poly([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], 'rgb(0,200,0)');
        poly([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], id(y * N + x));

  function makeBlueprint(lv, variant = 0) {

      const v = viewsOf(h);

      if (n < N + 1 || !h.flat().some(x => x >= 2)) continue;
      if (new Set(v.front).size < 2 || new Set(v.side).size < 2) continue;
      if (v.front.includes(0) || v.side.includes(0)) continue;
      if (mode === 'picture') {

      }

  function drawIso(canvas, h, N, maxH, labels) {
    const dpr = Math.min(2, devicePixelRatio || 1);
    const Wc = canvas.clientWidth || 180, Hc = canvas.clientHeight || 160;
    canvas.width = Wc * dpr; canvas.height = Hc * dpr;
    const g = canvas.getContext('2d'); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, Wc, Hc);
    const pad = labels ? 22 : 8;
    const s = Math.min((Wc - pad * 2) / (2 * N), (Hc - pad * 2) / (N + maxH * 1.1 + .2));
    const a = s, b = s / 2, c = s * 1.1;
    const ox = Wc / 2, oy = pad + maxH * c + (Hc - pad * 2 - (N * s + maxH * c)) / 2;
    const P = (x, y, z) => [ox + (x - y) * a, oy + (x + y) * b - z * c];
    const poly = (pts, fill) => { g.beginPath(); pts.forEach(([X, Y], i) => i ? g.lineTo(X, Y) : g.moveTo(X, Y)); g.closePath(); g.fillStyle = fill; g.fill(); g.lineWidth = 1.5; g.strokeStyle = FACE.edge; g.stroke(); };
    // ground
    poly([P(0, 0, 0), P(N, 0, 0), P(N, N, 0), P(0, N, 0)], 'rgba(95,179,74,.55)');
    for (let d = 0; d <= 2 * N - 2; d++) for (let x = 0; x < N; x++) {
      const y = d - x; if (y < 0 || y >= N) continue;
      for (let z = 0; z < h[y][x]; z++) {
        poly([P(x, y + 1, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], FACE.front);
        poly([P(x + 1, y, z), P(x + 1, y + 1, z), P(x + 1, y + 1, z + 1), P(x + 1, y, z + 1)], FACE.side);
        poly([P(x, y, z + 1), P(x + 1, y, z + 1), P(x + 1, y + 1, z + 1), P(x, y + 1, z + 1)], FACE.top);
      }
    }
    if (labels) {
      g.font = '800 12px "Baloo 2", sans-serif'; g.textAlign = 'center';
      const [fx, fy] = P(N / 2, N, 0), [sx, sy] = P(N, N / 2, 0);
      g.fillStyle = FACE.front; g.fillText('FRONT', fx - 16, fy + 16);
      g.fillStyle = FACE.side; g.fillText('SIDE', sx + 16, sy + 16);
    }
  }
  // A flat view: columns of blocks (front/side) or a map of squares (top)
  function viewPanel(kind, v, N, maxH) {
    const wrap = el('div', 'view ' + kind);
    const label = { front: 'Front', side: 'Side', top: 'Top' }[kind];
    const g = el('div', 'vgrid');
    if (kind === 'top') {
      g.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
      for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) g.appendChild(el('i', v.top[y][x] ? 'on' : ''));
    } else {
      // side view: looking at the orange faces, the front of the build is on the left
      const cols = kind === 'front' ? v.front : v.side.slice().reverse();
      g.style.gridTemplateColumns = `repeat(${N}, 1fr)`;
      for (let z = maxH - 1; z >= 0; z--) for (let i = 0; i < N; i++) g.appendChild(el('i', cols[i] > z ? 'on' : ''));

  }

  function buildYard(lv, variant = 0) {
    let B;

    const shown = { picture: [], fronttop: ['front', 'top'], three: ['front', 'side', 'top'], fewest: ['front', 'side', 'top'], fewest2: ['front', 'side'], most: ['front', 'side', 'top'] }[mode];
    const check = { front: shown.includes('front') || mode === 'picture', side: shown.includes('side') || mode === 'picture', top: shown.includes('top') || mode === 'picture' };

      three: ['Build it from three views!', 'The blue blocks above the grid show the front: each column shows its tallest stack. The orange blocks beside the grid show the side: each row shows its tallest stack. The corner shows the top. Build something that matches all three.'],
      fewest: ['Match the views with the fewest blocks!', 'Build something that looks the same from the front, the side and the top, using as few blocks as you can. Only ' + B.goal + ' blocks are needed!'],
      fewest2: ['Front and side only. Fewest blocks!', 'This time you only see the front and the side. Match them using the fewest blocks. It can be done with ' + B.goal + ' blocks.'],
