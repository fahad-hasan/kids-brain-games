<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Flip &amp; Find</title>
<meta name="description" content="A 4 by 4 memory game: flip two tiles at a time and find all 8 pairs.">
<meta name="theme-color" content="#16213e">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip &amp; Find">
<link rel="preload" href="../fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url("../fonts/baloo2-600.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("../fonts/baloo2-800.woff2") format("woff2"); }

/* Layout: top bar, mode and tile-set pickers, a score strip, then a square 4x4 board centred on the screen.
   Look: a dark games-table with chunky cream tiles; backs carry a coral pattern, faces show pixel pictures. One deliberate dark look. */
:root {
  --table: #16213e;
  --table-2: #1f2d52;
  --tile: #fff4dc;
  --back: #ff6b6b;
  --back-2: #ff8e72;
  --ink: #fdf6e3;
  --ink-dark: #16213e;
  --gold: #ffcf3a;
  --mint: #5ee6a8;
  --muted: #a9b4d6;
  --font: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: 100%;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; height: 100%;
  background: radial-gradient(ellipse at 50% 30%, var(--table-2), var(--table) 70%);
  color: var(--ink); font-family: var(--font); font-weight: 600; font-size: 1.05rem;
  overflow: hidden; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: clamp(1.4rem, 6vw, 1.9rem); font-weight: 800; line-height: 1; letter-spacing: .01em; }
.top h1 span { color: var(--back); }
.ibtn { flex: none; width: 46px; height: 46px; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 2px solid rgba(255,255,255,.18); border-radius: 14px; color: var(--ink); cursor: pointer; text-decoration: none; padding: 0; }
.ibtn svg { width: 24px; height: 24px; }
#sound .mute, #sound[aria-pressed="false"] .waves { display: none; }
#sound[aria-pressed="false"] .mute { display: inline; }
.ibtn:focus-visible, .seg button:focus-visible, .tile:focus-visible, .btn:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

main { flex: 1; min-height: 0; overflow-y: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 2px 20px; }
.col { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.pickers { width: 100%; display: flex; flex-direction: column; gap: 8px; }
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.25); }
.seg button { flex: 1; min-width: 0; padding: 6px 4px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-weight: 800; font-size: .98rem; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--tile); color: var(--ink-dark); }
.strip { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { text-align: center; padding: 4px 2px; border-radius: 12px; background: rgba(255,255,255,.06); }
.stat b { display: block; font-size: 1.45rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stat.best b { color: var(--gold); }

.board {
  --s: min(calc(100vw - 32px), calc(100dvh - 330px), 520px);
  width: var(--s); height: var(--s); max-width: 100%;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: calc(var(--s) * .028);
  perspective: 900px;
}
.tile { position: relative; padding: 0; border: none; background: none; cursor: pointer; border-radius: 16px; }
.tile .in { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .38s cubic-bezier(.3,1.4,.5,1); }
.tile.up .in, .tile.done .in { transform: rotateY(180deg); }
.tile .face, .tile .backside { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: grid; place-items: center; }
.tile .backside {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.35) 0 18%, transparent 19%),
    repeating-linear-gradient(45deg, var(--back) 0 10px, var(--back-2) 10px 20px);
  box-shadow: inset 0 0 0 4px rgba(255,255,255,.25), 0 5px 0 #b8434a;
}
.tile .backside::after { content: "?"; font-weight: 800; font-size: calc(var(--s) * .09); color: #fff; text-shadow: 0 2px 0 #b8434a; }
.tile .face { background: var(--tile); transform: rotateY(180deg); box-shadow: 0 5px 0 #c9b88f; }
.tile .face svg { width: 72%; height: 72%; image-rendering: pixelated; }
.tile.done .face { background: #e3fbef; box-shadow: 0 5px 0 #7fcfa8, inset 0 0 0 4px var(--mint); }
.tile.miss .face { box-shadow: 0 5px 0 #c9b88f, inset 0 0 0 4px var(--back); }
.tile.pop .in { animation: pop .45s; }
@keyframes pop { 40% { transform: rotateY(180deg) scale(1.1); } 100% { transform: rotateY(180deg) scale(1); } }
.msg { min-height: 1.5em; text-align: center; font-weight: 800; color: var(--gold); max-width: 32ch; }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn { border: none; border-radius: 14px; cursor: pointer; padding: 8px 22px; font-size: 1.15rem; font-weight: 800; color: var(--ink-dark); background: var(--gold); box-shadow: 0 5px 0 #b8901a; }
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b8901a; }
.btn.alt { background: var(--tile); box-shadow: 0 5px 0 #c9b88f; }
.whoami { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: .95rem; color: var(--muted); }
.whoami svg { width: 26px; height: 26px; }
.whoami a { color: var(--ink); }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(8, 12, 30, .7); padding: 20px; }
.win { width: min(380px, 100%); text-align: center; padding: 22px 18px 20px; border-radius: 22px; background: var(--tile); color: var(--ink-dark); box-shadow: 0 8px 0 #c9b88f; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.win h2 { margin: 0; font-size: 2.1rem; line-height: 1.05; }
.win p { margin: 0; font-size: 1.1rem; }
.win .rec { color: #c2410c; font-weight: 800; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 54px; height: 54px; animation: pop2 .45s backwards; }
.stars svg:nth-child(2) { animation-delay: .15s; } .stars svg:nth-child(3) { animation-delay: .3s; }
@keyframes pop2 { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .tile .in { transition: none; } .tile.pop .in, .stars svg { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Flip <span>&amp;</span> Find</h1>
    <button class="ibtn" id="sound" type="button" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <a class="ibtn" href="../" aria-label="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></a>
  </header>
  <main>
    <div class="col">
      <div class="pickers">
        <div class="seg" id="modes" role="group" aria-label="Mode"></div>
        <div class="seg" id="themes" role="group" aria-label="Tile pictures"></div>
      </div>
      <div class="strip">
        <div class="stat"><b id="moves">0</b><span>Moves</span></div>
        <div class="stat"><b id="pairs">0/8</b><span>Pairs</span></div>
        <div class="stat"><b id="time">0:00</b><span>Time</span></div>
        <div class="stat best"><b id="best">–</b><span>Best</span></div>
      </div>
      <div class="board" id="board" aria-label="Memory tiles"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="row"><button class="btn" id="newGame" type="button">New game</button></div>
      <p class="whoami" id="whoami"></p>
    </div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="stars" id="winStars"></div>
    <h2 id="winTitle">All pairs found!</h2>
    <p id="winText"></p>
    <p class="rec" id="winRec"></p>
    <div class="row"><button class="btn alt" id="close" type="button">Look at the board</button><button class="btn" id="again" type="button">Play again</button></div>
  </div>
</div>

<script src="../shared/profiles.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- sound ----------
  let audio = null, soundOn = true;
  addEventListener('pointerdown', () => { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (_) { audio = null; } }, { once: true });
  function beep(f, d = .08, type = 'triangle', v = .1) {
    if (!soundOn || !audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, audio.currentTime); g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + d);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + d);
  }
  const tune = (n, gap = 90) => n.forEach((f, i) => setTimeout(() => beep(f, .16, 'triangle', .14), i * gap));
  $('sound').addEventListener('click', () => { soundOn = !soundOn; $('sound').setAttribute('aria-pressed', soundOn); $('sound').setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off'); });

  // ---------- pixel pictures (all original). 'c' is the main colour, so Tricky mode can recolour them. ----------
  function px(rows, pal) {
    let r = '';
    rows.forEach((row, y) => [...row].forEach((ch, x) => { if (pal[ch]) r += `<rect x="${x}" y="${y}" width="1.05" height="1.05" fill="${pal[ch]}"/>`; }));
    return `<svg viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges" aria-hidden="true">${r}</svg>`;
  }
  const BASE = { k: '#16213e', w: '#ffffff', y: '#ffcf3a', o: '#ff8a1f', g: '#36c46b', b: '#3a8dff', r: '#ff4f5e', m: '#16213e' };
  const SHAPES = {
    space: {
      rocket: [['...kk...', '..kcck..', '..kwwk..', '..kcck..', '.kkcckk.', 'kc.cc.ck', 'k..oo..k', '...yy...'], '#ff4f5e'],
      planet: [['..kkkk..', '.kcccck.', 'kcccccck', 'yyyyyyyy', 'kcccccck', '.kcccck.', '..kkkk..', '........'], '#9b6bff'],
      star: [['...kk...', '...cc...', 'kkcccckk', '.kcccck.', '..cccc..', '.cckkcc.', '.kk..kk.', '........'], '#ffcf3a'],
      moon: [['..kkk...', '.kcck...', 'kcck....', 'kcck....', 'kcck....', 'kccck...', '.kcccck.', '..kkkk..'], '#e8e2f4'],
      ufo: [['........', '...kk...', '..kwwk..', '.kkkkkk.', 'kcccccck', '.kkkkkk.', '..y..y..', '........'], '#5ee6a8'],
      comet: [['....kkk.', '...kccck', '..wkccck', '.w.kccck', 'w...kkk.', '.w......', '..w.....', '........'], '#4cc9f0'],
      alien: [['..k..k..', '..kcck..', '.kcccck.', 'kcwccwck', 'kcccccck', '.kcmmck.', '..kcck..', '..k..k..'], '#7ae582'],
      satellite: [['b.....b.', 'bb.kk.bb', 'bbkcckbb', '..kcck..', 'bbkcckbb', 'bb.kk.bb', 'b.....b.', '........'], '#b9c2d6']
    },
    animals: {
      cat: [['k......k', 'kk....kk', 'kcccccck', 'kcwccwck', 'kcccccck', 'kccmmcck', '.kcccck.', '..kkkk..'], '#ff8a1f'],
      fish: [['........', '...kkk..', 'k.kcccck', 'kkccccwk', 'kkcccckk', 'k.kccck.', '...kkk..', '........'], '#4cc9f0'],
      frog: [['.kk..kk.', 'kwkkkkwk', 'kcccccck', 'kcccccck', 'kcmmmmck', '.kcccck.', 'kc.kk.ck', '........'], '#36c46b'],
      bird: [['........', '..kkk...', '.kcwck..', 'kcccckoo', 'kccccck.', '.kccck..', '..k.k...', '........'], '#3a8dff'],
      bee: [['..w..w..', '...ww...', '.kkkkkk.', 'kcmkcmck', 'kcmkcmck', '.kkkkkk.', '........', '........'], '#ffcf3a'],
      snail: [['........', '....kkk.', '...kcckk', '...kckck', 'k..kcckk', 'kk.kkkk.', 'kkkkkkkk', '........'], '#c77dff'],
      turtle: [['........', '..kkkk..', '.kcccck.', 'kcckkcck', 'kcccccck', 'gkkkkkkg', 'g.g..g.g', '........'], '#2f9e5a'],
      dog: [['kk....kk', 'kckkkkck', 'kcccccck', 'kcwccwck', 'kcccccck', '.kcmmck.', '..kmmk..', '...kk...'], '#c08a4e']
    },
    food: {
      apple: [['...g....', '..kgk...', '.kccck..', 'kcwccck.', 'kccccck.', 'kccccck.', '.kccck..', '..kkk...'], '#ff4f5e'],
      grapes: [['...g....', '..kkk...', '.kckck..', 'kckckck.', '.kckck..', '..kck...', '...k....', '........'], '#9b6bff'],
      cake: [['...r....', '...y....', '.kkkkkk.', 'kwwwwwwk', 'kcccccck', 'kwwwwwwk', 'kcccccck', 'kkkkkkkk'], '#ff8fc7'],
      icecream: [['..kkkk..', '.kcccck.', '.kcwcck.', '.kkkkkk.', '..kyyk..', '..kyyk..', '...kk...', '........'], '#5ee6a8'],
      pizza: [['kkkkkkkk', 'kyycyyyk', '.kyyyck.', '.kycyk..', '..kyyk..', '..kyk...', '...k....', '........'], '#ff4f5e'],
      carrot: [['....g.g.', '.....g..', '....kk..', '...kcck.', '..kcck..', '.kcck...', 'kck.....', 'k.......'], '#ff8a1f'],
      donut: [['..kkkk..', '.kcccck.', 'kcckkcck', 'kck..kck', 'kcckkcck', '.kcccck.', '..kkkk..', '........'], '#ff8fc7'],
      egg: [['..kkkk..', '.kwwwwk.', 'kwwccwwk', 'kwcccwwk', 'kwwccwwk', '.kwwwwk.', '..kkkk..', '........'], '#ffcf3a']
    }
  };
  const art = (rows, c) => px(rows, { ...BASE, c });
  const TRICKY_COLOURS = ['#ff4f5e', '#3a8dff', '#36c46b', '#ffcf3a', '#9b6bff', '#ff8a1f'];
  const COLOUR_NAME = { '#ff4f5e': 'red', '#3a8dff': 'blue', '#36c46b': 'green', '#ffcf3a': 'yellow', '#9b6bff': 'purple', '#ff8a1f': 'orange' };
  const STAR_ON = px(['....y....', '...yyy...', 'yyyyyyyyy', '.yyyyyyy.', '..yyyyy..', '.yyy.yyy.', '.yy...yy.'], { y: '#ffb800' });
  const STAR_OFF = px(['....y....', '...yyy...', 'yyyyyyyyy', '.yyyyyyy.', '..yyyyy..', '.yyy.yyy.', '.yy...yy.'], { y: '#d9cfb3' });
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---------- modes, tile sets, per-player saves ----------
  const MODES = { easy: 'Easy', normal: 'Normal', tricky: 'Tricky' };
  const THEMES = { space: 'Space', animals: 'Animals', food: 'Food', mix: 'Mix' };
  const me = KBG.current();
  let save = Object.assign({ games: 0, perfect: 0, best: {}, mode: 'normal', theme: 'mix' }, KBG.get('flipfind', {}));
  let mode = MODES[save.mode] ? save.mode : 'normal', theme = THEMES[save.theme] ? save.theme : 'mix';
  function persist() {
    KBG.set('flipfind', save);
    const bests = Object.values(save.best).map(b => b.moves);
    KBG.setBest('flipfind', { games: save.games, bestMoves: bests.length ? Math.min(...bests) : 0, perfect: save.perfect });
  }
  function seg(box, opts, cur, onPick) {
    box.innerHTML = '';
    for (const [k, label] of Object.entries(opts)) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.setAttribute('aria-pressed', k === cur);
      b.addEventListener('click', () => onPick(k)); box.appendChild(b);
    }
  }
  function drawPickers() {
    seg($('modes'), MODES, mode, k => { mode = k; save.mode = k; persist(); drawPickers(); newGame(); });
    seg($('themes'), THEMES, theme, k => { theme = k; save.theme = k; persist(); drawPickers(); newGame(); });
  }

  // ---------- the game ----------
  let tiles = [], open = [], moves = 0, found = 0, startedAt = 0, elapsed = 0, timer = null, locked = false, peekTimer = null;
  const board = $('board');
  function deal() {
    let faces;
    if (mode === 'tricky') {
      // 4 pictures, each in 2 colours: look-alikes you have to tell apart
      const pool = theme === 'mix' ? Object.values(SHAPES).flatMap(t => Object.entries(t)) : Object.entries(SHAPES[theme]);
      faces = shuffle(pool).slice(0, 4).flatMap(([name, [rows]]) => shuffle(TRICKY_COLOURS).slice(0, 2).map(c => ({ id: name + c, label: COLOUR_NAME[c] + ' ' + name, svg: art(rows, c) })));
    } else {
      const pool = theme === 'mix' ? shuffle(Object.values(SHAPES).flatMap(t => Object.entries(t))) : Object.entries(SHAPES[theme]);
      faces = shuffle(pool).slice(0, 8).map(([name, [rows, c]]) => ({ id: name, label: name, svg: art(rows, c) }));
    }
    return shuffle([...faces, ...faces]).map((f, i) => ({ ...f, i, state: 'down' }));
  }
  function newGame() {
    clearInterval(timer); clearTimeout(peekTimer);
    tiles = deal(); open = []; moves = 0; found = 0; elapsed = 0; startedAt = 0; locked = false;
    $('overlay').hidden = true;
    board.innerHTML = '';
    tiles.forEach(t => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tile';
      b.innerHTML = `<span class="in"><span class="backside"></span><span class="face">${t.svg}</span></span>`;
      b.addEventListener('click', () => flip(t));
      t.el = b; board.appendChild(b);
    });
    drawAll(); stats();
    if (mode === 'easy') {
      // a quick peek at every tile before the game starts
      locked = true;
      msg('Have a look... remember where things are!');
      tiles.forEach(t => t.el.classList.add('up'));
      peekTimer = setTimeout(() => { tiles.forEach(t => t.el.classList.remove('up')); locked = false; msg('Go! Find the pairs.'); }, 3500);
    } else msg(mode === 'tricky' ? 'Tricky: pairs must match in picture AND colour!' : 'Flip two tiles. Find all 8 pairs!');
  }
  function drawTile(t) {
    t.el.className = 'tile' + (t.state === 'up' ? ' up' : '') + (t.state === 'done' ? ' done' : '');
    t.el.setAttribute('aria-label', 'Tile ' + (t.i + 1) + ': ' + (t.state === 'down' ? 'face down' : t.label + (t.state === 'done' ? ', matched' : '')));
  }
  function drawAll() { tiles.forEach(drawTile); }
  const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  function stats() {
    $('moves').textContent = moves;
    $('pairs').textContent = found + '/8';
    $('time').textContent = fmt(elapsed);
    const b = save.best[mode];
    $('best').textContent = b ? b.moves : '–';
  }
  function msg(t) { $('msg').textContent = t; }
  function flip(t) {
    if (locked || t.state !== 'down') return;
    // tapping a third tile right away turns the last two back over
    if (open.length === 2) { open.forEach(o => { o.state = 'down'; o.el.classList.remove('miss'); drawTile(o); }); open = []; }
    if (!startedAt) { startedAt = Date.now(); timer = setInterval(() => { elapsed = Math.floor((Date.now() - startedAt) / 1000); stats(); }, 250); }
    t.state = 'up'; drawTile(t); open.push(t);
    beep(open.length === 1 ? 520 : 620, .06);
    if (open.length < 2) return;
    moves++; stats();
    const [a, b] = open;
    if (a.id === b.id) {
      a.state = b.state = 'done'; found++;
      setTimeout(() => { [a, b].forEach(o => { drawTile(o); o.el.classList.add('pop'); }); }, reduced ? 0 : 250);
      open = [];
      tune([784, 1047], 80); stats();
      msg(found === 8 ? '' : ['Nice!', 'A pair!', 'Great memory!', 'Got it!'][found % 4]);
      if (found === 8) finish();
    } else {
      a.el.classList.add('miss'); b.el.classList.add('miss');
      beep(220, .12, 'square', .05);
      // the wrong pair stays up for a moment (or until the next tap) so it can be remembered
      setTimeout(() => {
        if (open.includes(a) && open.includes(b)) { [a, b].forEach(o => { o.state = 'down'; o.el.classList.remove('miss'); drawTile(o); }); open = []; }
      }, 1100);
    }
  }
  function finish() {
    clearInterval(timer);
    elapsed = Math.max(elapsed, Math.floor((Date.now() - startedAt) / 1000)); stats();
    // 8 moves is a perfect game; finding pairs takes some luck at first, so stars allow a little exploring
    const stars = moves <= 12 ? 3 : moves <= 18 ? 2 : 1;
    const prev = save.best[mode];
    const record = !prev || moves < prev.moves || (moves === prev.moves && elapsed < prev.time);
    if (record) save.best[mode] = { moves, time: elapsed };
    save.games++; if (moves === 8) save.perfect++;
    persist();
    KBG.record('flipfind-games', { moves, time: elapsed, stars }, { total: true });
    setTimeout(() => {
      tune(stars === 3 ? [523, 659, 784, 1047, 1319] : [523, 659, 784, 1047]);
      $('winStars').innerHTML = [0, 1, 2].map(i => i < stars ? STAR_ON : STAR_OFF).join('');
      $('winTitle').textContent = moves === 8 ? 'Perfect memory!' : 'All pairs found!';
      $('winText').textContent = moves + ' moves in ' + fmt(elapsed) + (mode === 'tricky' ? ' on Tricky' : mode === 'easy' ? ' on Easy' : '') + '.';
      $('winRec').textContent = record ? (prev ? 'New best! Your old best was ' + prev.moves + ' moves.' : 'Your first ' + MODES[mode] + ' score!') : 'Your best is ' + save.best[mode].moves + ' moves.';
      $('overlay').hidden = false; $('again').focus();
      stats();
    }, reduced ? 200 : 700);
  }
  $('newGame').addEventListener('click', newGame);
  $('again').addEventListener('click', newGame);
  $('close').addEventListener('click', () => { $('overlay').hidden = true; });
  $('whoami').innerHTML = KBG.avatarSvg(me.avatar) + '<span></span><a href="../">Change</a>';
  $('whoami').querySelector('span').textContent = 'Playing as ' + me.name + ' ·';

  window.__ff = { get tiles() { return tiles; }, newGame };
  drawPickers(); newGame();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {}));
})();
</script>
