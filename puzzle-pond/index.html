<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Puzzle Pond</title>
<meta name="description" content="A fishing game where every catch is a puzzle: time your drop, weigh the fish and steer the hook through the currents.">
<meta name="theme-color" content="#0b4f6c">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="icon.png" type="image/png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puzzle Pond">
<link rel="preload" href="../fonts/baloo2-800.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Baloo 2"; font-weight: 600; font-display: swap; src: url("../fonts/baloo2-600.woff2") format("woff2"); }
@font-face { font-family: "Baloo 2"; font-weight: 800; font-display: swap; src: url("../fonts/baloo2-800.woff2") format("woff2"); }

/* Layout: a lakeside dock. Deep-water top band, sandy wooden page, and the lake itself as the puzzle board.
   Each puzzle stacks: the question, the counters, the lake, the controls. */
:root {
  --deep: #0b4f6c;
  --deep-2: #136f93;
  --sky: #bfe8ff;
  --water: #2a9fd6;
  --water-2: #1677ad;
  --sand: #fff3d6;
  --plank: #f3dfb4;
  --ink: #1b2b3a;
  --muted: #5b6b78;
  --card: #ffffff;
  --float: #ff6b4a;
  --gold: #ffc93c;
  --yes: #2f9e5a;
  --no: #d64545;
  --font: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  color-scheme: light;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  height: 100%;
  background: var(--deep);
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; }
body {
  margin: 0; height: 100%; color: var(--ink); font-family: var(--font); font-weight: 600; font-size: 1.05rem;
  background: var(--sand);
  overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.app { height: 100%; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 8px; background: var(--deep); color: #fff; padding-block: 10px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.top h1 { flex: 1; min-width: 0; margin: 0; font-size: clamp(1.2rem, 5vw, 1.6rem); font-weight: 800; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn { flex: none; width: 46px; height: 46px; display: grid; place-items: center; background: var(--deep-2); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; color: #fff; cursor: pointer; text-decoration: none; padding: 0; }
.ibtn svg { width: 24px; height: 24px; }
#sound .mute, #sound[aria-pressed="false"] .waves { display: none; }
#sound[aria-pressed="false"] .mute { display: inline; }
.ibtn:focus-visible, .btn:focus-visible, button:focus-visible { outline: 4px solid var(--gold); outline-offset: 2px; }

.screen {
  flex: 1; min-height: 0; overflow-y: auto;
  background: repeating-linear-gradient(90deg, var(--sand) 0 118px, #f4e6c4 118px 120px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 26px;
}
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 12px; }
#stage { width: 100%; }

.hero { text-align: center; }
.hero svg.badge { width: 110px; height: 72px; }
.hero h2 { margin: 2px 0 0; font-size: clamp(2.6rem, 12vw, 3.8rem); line-height: 1; font-weight: 800; color: var(--deep); }
.hero h2 span { color: var(--water-2); }
.hero p { margin: 8px auto 0; max-width: 32ch; }
.whoami { display: flex; justify-content: center; align-items: center; gap: 8px; font-weight: 800; color: var(--muted); }
.whoami svg { width: 26px; height: 26px; }
.whoami a { color: var(--ink); }
.areas { display: grid; gap: 14px; width: 100%; }
.area { display: grid; grid-template-columns: 80px 1fr; gap: 14px; align-items: center; padding: 14px; text-align: left; cursor: pointer; background: var(--card); border: 2px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.area:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.area .art { width: 80px; height: 80px; border-radius: 12px; display: grid; place-items: center; background: linear-gradient(var(--sky) 0 30%, var(--water) 30%); overflow: hidden; }
.area .art svg { width: 70px; height: 70px; }
.area b { display: block; font-size: 1.45rem; line-height: 1.1; }
.area span { display: block; color: var(--muted); font-size: .98rem; }
.area .prog { margin-top: 6px; display: flex; align-items: center; gap: 6px; font-weight: 800; color: var(--ink); }
.area .prog svg { width: 20px; height: 20px; }

.blurb { margin: 0; text-align: center; font-size: clamp(1.2rem, 4.6vw, 1.45rem); font-weight: 800; line-height: 1.2; text-wrap: balance; }
.levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 12px; width: 100%; }
.lvl { aspect-ratio: 1; max-width: 100%; border: 2px solid var(--ink); border-radius: 50%; background: var(--card); box-shadow: 0 3px 0 var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: 800; }
.lvl:disabled { opacity: .45; cursor: default; }
.lvl.next { background: var(--gold); }
.lvl .stars { display: flex; gap: 1px; } .lvl .stars svg { width: 17px; height: 17px; }
.lvl svg.lock { width: 26px; height: 26px; }
.lvl.endless { grid-column: span 2; aspect-ratio: auto; min-height: 84px; flex-direction: row; gap: 12px; border-radius: 999px; }
.lvl .inf { font-size: 2.4rem; line-height: 1; color: var(--deep-2); }
.lvl .small { font-size: 1rem; }

.q { margin: 0; text-align: center; font-size: clamp(1.25rem, 5vw, 1.7rem); font-weight: 800; line-height: 1.15; text-wrap: balance; }
.status { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 12px; font-weight: 800; font-size: 1rem; font-variant-numeric: tabular-nums; }
.chip.goal { background: var(--gold); }
.msg { min-height: 1.5em; text-align: center; font-weight: 800; max-width: 36ch; text-wrap: balance; }
.msg.bad { color: var(--no); } .msg.good { color: var(--yes); }
.row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.btn { border: 2px solid var(--ink); border-radius: 12px; cursor: pointer; padding: 6px 18px; font-size: 1.12rem; font-weight: 800; background: var(--gold); box-shadow: 0 3px 0 var(--ink); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--card); }
.btn.go { background: var(--float); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.hint { outline: 4px solid var(--gold); box-shadow: 0 0 16px #e8a800; }
.label { font-size: .82rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0; align-self: flex-start; }

.overlay { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(10, 40, 60, .55); padding: 20px; }
.win { width: min(390px, 100%); text-align: center; padding: 22px 18px 20px; background: var(--card); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); display: flex; flex-direction: column; align-items: center; gap: 10px; }
.win h2 { margin: 0; font-size: 2rem; line-height: 1.05; }
.win p { margin: 0; font-size: 1.08rem; max-width: 30ch; }
.bigstars { display: flex; gap: 6px; }
.bigstars svg { width: 54px; height: 54px; animation: pop .45s backwards; }
.bigstars svg:nth-child(2) { animation-delay: .15s; } .bigstars svg:nth-child(3) { animation-delay: .3s; }
.trophy { width: 100px; height: 100px; animation: pop .5s; }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes bob { 50% { transform: translateY(-3%); } }
.shake { animation: shake .3s; }

/* THE LAKE BOARD (used by Gold Fish Drop and Current Maze) */
.lake { position: relative; width: 100%; margin: 0 auto; border: 3px solid var(--ink); border-radius: 14px; overflow: hidden;
  background:
    linear-gradient(var(--sky) 0 calc(100% / var(--h)), transparent 0),
    linear-gradient(#5cc2f0, var(--water) 30%, var(--water-2));
}
.lake .grid { position: absolute; inset: calc(100% / var(--h)) 0 0 0;
  background-image: linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.13) 1px, transparent 1px);
  background-size: calc(100% / var(--w)) calc(100% / (var(--h) - 1)); }
.lake .surf { position: absolute; left: 0; right: 0; top: calc(100% / var(--h) - 4px); height: 8px; background: repeating-linear-gradient(90deg, #e9f8ff 0 10px, #8fd6f5 10px 20px); opacity: .8; }
.lake .it { position: absolute; width: calc(100% / var(--w)); height: calc(100% / var(--h)); display: grid; place-items: center; padding: 2px; transition: left .28s linear; }
.lake .it svg { width: 100%; height: 100%; }
.lake .it.noanim { transition: none; }
.lake .boat { z-index: 3; pointer-events: none; animation: bob 1.6s ease-in-out infinite; }
.lake svg.line { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.lake .cell { position: absolute; width: calc(100% / var(--w)); height: calc(100% / var(--h)); padding: 2px; border: 0; background: none; display: grid; place-items: center; }
.lake .cell svg { width: 100%; height: 100%; }
.lake button.cell { cursor: pointer; }
.lake button.cell.cur { border-radius: 10px; }
.lake button.cell.cur::before { content: ""; position: absolute; inset: 6%; border-radius: 10px; background: rgba(255,255,255,.28); border: 2px solid rgba(255,255,255,.75); }
.lake button.cell.cur.flipped::before { background: rgba(255, 201, 60, .55); border-color: #fff3c4; }
.lake button.cell.cur svg { position: relative; }
.lake .cell.hint::before, .lake .it.hint { outline: 4px solid var(--gold); outline-offset: -4px; border-radius: 10px; box-shadow: 0 0 18px #ffd34d inset; }
.lake .skybtn { position: absolute; top: 0; height: calc(100% / var(--h)); width: calc(100% / var(--w)); border: 0; background: none; cursor: pointer; z-index: 1; }
.pad { display: grid; grid-template-columns: repeat(4, auto); gap: 8px; justify-content: center; }
.pad .btn { min-width: 70px; padding: 6px 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.pad .btn svg { width: 26px; height: 26px; }
.pad .btn small { font-size: .85rem; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 12px; font-size: .92rem; color: var(--muted); font-weight: 800; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.legend svg { width: 26px; height: 26px; }

/* FISH MARKET */
.cats { width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.bucket { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px; border: 3px solid var(--ink); border-radius: 14px; background: var(--card); cursor: pointer; text-align: center; }
.bucket.sel { box-shadow: 0 0 0 4px var(--gold); background: #fffbea; }
.bucket .who { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.bucket .who svg { width: 46px; height: 46px; }
.bucket .order { font-size: 1.05rem; line-height: 1.1; }
.bucket .order b { font-size: 1.35rem; }
.bucket .total { font-weight: 800; font-size: 1.1rem; padding: 0 10px; border-radius: 999px; background: #eef4f8; font-variant-numeric: tabular-nums; }
.bucket .total.ok { background: #c9f0d6; color: #17643a; } .bucket .total.over { background: #f9d0d0; color: #9c1f1f; }
.bucket .tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; min-height: 58px; width: 100%; padding: 4px; border-radius: 10px; background: repeating-linear-gradient(45deg, #e8f4fb 0 8px, #dcedf7 8px 16px); }
.pond { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 12px 8px; min-height: 92px; border: 3px solid var(--ink); border-radius: 50% / 28%; background: linear-gradient(#5cc2f0, var(--water-2)); }
.fishbtn { position: relative; width: 74px; height: 58px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
.fishbtn svg { width: 100%; height: 100%; overflow: visible; }
.fishbtn .kg { position: absolute; left: 50%; top: 50%; transform: translate(-62%, -50%); min-width: 30px; height: 30px; padding: 0 4px; border-radius: 999px; display: grid; place-items: center; background: #fff; border: 2px solid var(--ink); font-weight: 800; font-size: 1.05rem; line-height: 1; }
.tray .fishbtn { width: 60px; height: 48px; }
.tray .fishbtn .kg { min-width: 26px; height: 26px; font-size: .95rem; }
.fishbtn.locked .kg { background: var(--gold); }
.fishbtn.hint { filter: drop-shadow(0 0 8px #ffd34d); }
.fishbtn.new { animation: pop .3s; }
@media (prefers-reduced-motion: reduce) { .bigstars svg, .trophy, .shake, .fishbtn.new, .lake .boat { animation: none; } .lake .it { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="ibtn" id="back" type="button" aria-label="Back" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M10 4L2 12l8 8v-5h12V9H10z"/></svg></button>
    <h1 id="title">Puzzle Pond</h1>
    <button class="ibtn" id="hear" type="button" aria-label="Read it to me" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 4h18v12H9l-5 4v-4H3z"/><path fill="none" stroke="#0b4f6c" stroke-width="2" stroke-linecap="round" d="M7 8.5h10M7 12h6"/></svg></button>
    <button class="ibtn" id="sound" type="button" aria-pressed="true" aria-label="Sound on"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path class="waves" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mute" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M16 9l6 6M22 9l-6 6"/></svg></button>
    <a class="ibtn" href="../" aria-label="All games"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg></a>
  </header>

  <section class="screen" id="mapScreen">
    <div class="col">
      <div class="hero">
        <span id="badge"></span>
        <h2>Puzzle <span>Pond</span></h2>
        <p>Every catch is a puzzle. Think first, then fish! Each pond is brand new.</p>
        <p class="whoami" id="whoami"></p>
      </div>
      <div class="areas" id="areas"></div>
    </div>
  </section>

  <section class="screen" id="levelScreen" hidden>
    <div class="col">
      <p class="blurb" id="areaBlurb"></p>
      <div class="levels" id="levels"></div>
    </div>
  </section>

  <section class="screen" id="playScreen" hidden>
    <div class="col">
      <h2 class="q" id="q"></h2>
      <div class="status" id="status"></div>
      <div id="stage" class="col"></div>
      <div class="msg" id="msg" aria-live="polite"></div>
      <div class="row" id="actions"></div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div id="winArt"></div>
    <h2 id="winTitle">Great catch!</h2>
    <p id="winText"></p>
    <div class="row" id="winBtns"></div>
  </div>
</div>

<script src="../shared/profiles.js"></script>
<script>
(() => {
// PP-ENGINES-START
  const pickR = (r, a) => a[Math.floor(r() * a.length)];
  const intR = (r, lo, hi) => lo + Math.floor(r() * (hi - lo + 1));
  const shuffleR = (r, arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const freshSeed = () => { try { return crypto.getRandomValues(new Uint32Array(1))[0]; } catch (_) { return Math.floor(Math.random() * 4294967295); } };
  function rng(seed) {
    let a = seed >>> 0;
    return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  }
  const hashStr = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); };

  // ======================================================================
  // GOLD FISH DROP: fish swim along their rows. Every move of the boat (or a wait) is one tick.
  // Drop the hook: it sinks one row per tick and grabs the first thing it touches. Catch the gold fish!
  // Row r = { items: [{p, kind}], dir: 1 | -1, slow: 1 | 2 }  (slow 2 = moves every other tick; dir 0 = still)
  // ======================================================================
  const dPos = (row, it, T, W) => row.dir === 0 ? it.p : ((it.p + row.dir * Math.floor(T / row.slow)) % W + W) % W;
  // what is at (x, r) at time T?
  function dAt(L, x, r, T) { const row = L.rows[r]; for (const it of row.items) if (dPos(row, it, T, L.W) === x) return it.kind; return null; }
  // drop at time t0 from column x. Returns { kind, row, T } of what was caught (kind null = nothing)
  function dDrop(L, x, t0) {
    for (let r = 0; r < L.rows.length; r++) { const T = t0 + r + 1, k = dAt(L, x, r, T); if (k) return { kind: k, row: r, T }; }
    return { kind: null, row: L.rows.length, T: t0 + L.rows.length };
  }
  function dPeriod(L) { return L.rows.some(r => r.slow === 2) ? 2 * L.W : L.W; }
  // fewest presses (moves + waits + the drop) to catch the gold fish from boat column bx at time t
  function dSolve(L, bx, t = 0) {
    const P = dPeriod(L), key = (x, tt) => x + ',' + (tt % P);
    const seen = new Map([[key(bx, t), null]]), q = [[bx, t, 0]];
    while (q.length) {
      const [x, tt, n] = q.shift();
      if (dDrop(L, x, tt).kind === 'gold') {
        const path = ['drop']; let k = key(x, tt);
        while (seen.get(k)) { const [pk, a] = seen.get(k); path.unshift(a); k = pk; }
        return path;
      }
      for (const [dx, a] of [[-1, 'left'], [1, 'right'], [0, 'wait']]) {
        const nx = x + dx; if (nx < 0 || nx >= L.W) continue;
        const k = key(nx, tt + 1);
        if (!seen.has(k)) { seen.set(k, [key(x, tt), a]); q.push([nx, tt + 1, n + 1]); }
      }
    }
    return null;
  }
  const D_SPEC = [
    { W: 5, D: 3, extra: 1, slow: 0, still: 0 }, { W: 5, D: 3, extra: 2, slow: 0, still: 0 },
    { W: 6, D: 4, extra: 3, slow: 0, still: 0 }, { W: 6, D: 4, extra: 4, slow: 0, still: 1 },
    { W: 6, D: 5, extra: 5, slow: 1, still: 1 }, { W: 7, D: 5, extra: 6, slow: 1, still: 1 },
    { W: 7, D: 5, extra: 7, slow: 2, still: 1 }, { W: 7, D: 6, extra: 8, slow: 2, still: 2 },
    { W: 7, D: 6, extra: 9, slow: 2, still: 2 }, { W: 7, D: 6, extra: 10, slow: 3, still: 2 }
  ];
  function makeDrop(lv, seed) {
    const sp = D_SPEC[lv];
    for (let tries = 0; tries < 3000; tries++) {
      const r = rng(seed + tries * 7919);
      const rows = Array.from({ length: sp.D }, () => ({ items: [], dir: r() < .5 ? 1 : -1, slow: 1 }));
      const goldRow = sp.D - 1 - (lv >= 6 && r() < .4 ? 1 : 0);
      const stillRows = shuffleR(r, [...Array(goldRow).keys()]).slice(0, sp.still);
      stillRows.forEach(i => rows[i].dir = 0);
      shuffleR(r, [...Array(sp.D).keys()].filter(i => rows[i].dir !== 0)).slice(0, sp.slow).forEach(i => rows[i].slow = 2);
      rows[goldRow].items.push({ p: intR(r, 0, sp.W - 1), kind: 'gold' });
      if (rows[goldRow].dir === 0) rows[goldRow].dir = 1;
      for (let e = 0; e < sp.extra; e++) {
        const ri = intR(r, 0, sp.D - 1), row = rows[ri];
        if (row.items.length >= Math.ceil(sp.W / 2)) continue;
        const free = [...Array(sp.W).keys()].filter(p => !row.items.some(it => it.p === p));
        const kind = row.dir === 0 ? pickR(r, ['boot', 'rock']) : pickR(r, ['fish', 'fish', 'jelly']);
        if (row.dir === 0 && row.items.length >= 2) continue;
        row.items.push({ p: pickR(r, free), kind });
      }
      const L = { W: sp.W, rows, start: Math.floor(sp.W / 2), goldRow };
      const path = dSolve(L, L.start, 0);
      const minLen = 2 + Math.min(lv, 5);
      if (!path || path.length < minLen || path.length > 14) continue;
      // the obvious move (go straight above the gold fish now and drop) must fail
      const gx = dPos(rows[goldRow], rows[goldRow].items[0], 0, sp.W);
      const steps = Math.abs(gx - L.start);

  function showLevels(key) {

  function startLevel(key, lv, opts = {}) {

  function setQ(text, spoken) { $('q').textContent = text; speech = spoken || text; }
  function setMsg(text, kind, speak) { $('msg').textContent = text; $('msg').className = 'msg' + (kind ? ' ' + kind : ''); if (speak && text) say(text); }
  function action(label, fn, cls = '') { const b = el('button', 'btn ' + cls, label); b.type = 'button'; b.addEventListener('click', fn); $('actions').appendChild(b); return b; }
  function win(stars, title, text) {

  // the lake board: W columns, H rows (row 0 is the sky with the boat)
  function makeLake(W, H) {
    const lake = el('div', 'lake');
    lake.style.setProperty('--w', W); lake.style.setProperty('--h', H);
    lake.style.aspectRatio = W + ' / ' + H;
    lake.style.maxWidth = `min(100%, calc(${(W / H).toFixed(3)} * (100dvh - 330px)), ${W * 76}px)`;
    lake.style.minWidth = Math.min(W * 40, 300) + 'px';
    lake.append(el('div', 'grid'), el('div', 'surf'));
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    line.setAttribute('class', 'line'); line.setAttribute('viewBox', `0 0 ${W} ${H}`); line.setAttribute('preserveAspectRatio', 'none');
    lake.appendChild(line);
    const place = (node, x, y) => { node.style.left = (x / W * 100) + '%'; node.style.top = (y / H * 100) + '%'; };
    // draw the fishing line through a list of points (cell units), with a hook at the end
    const draw = pts => {
      if (!pts || !pts.length) { line.innerHTML = ''; return; }
      const [ex, ey] = pts[pts.length - 1];
      line.innerHTML = `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#1b2b3a" stroke-width="2.4" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`
        + `<path d="M${ex} ${ey} v.12 q0 .16 -.12 .16 q-.12 0 -.12 -.1" fill="none" stroke="#5b6b78" stroke-width="3" stroke-linecap="round" vector-effect="non-scaling-stroke"/>`
        + `<circle cx="${pts[0][0]}" cy="${pts[0][1] + .04}" r=".07" fill="#ff6b4a"/>`;

  }
  function padButton(label, icon, fn, cls = 'alt') {

    b.setAttribute('aria-label', label); b.addEventListener('click', fn); return b;

  // ======================================================================
  // GOLD FISH DROP
  // ======================================================================
  function buildDrop(L, lv) {
    const W = L.W, D = L.rows.length, H = D + 1;
    let bx = L.start, t = 0, presses = 0, fails = 0, hinted = false, busy = false, done = false, hookRow = null, timer = null;
    const hasStill = L.rows.some(r => r.dir === 0), hasSlow = L.rows.some(r => r.slow === 2);
    setQ('Catch the gold fish!', 'Catch the gold fish! Every time you move the boat or wait, all the fish swim one step. When you drop the hook, it sinks one row at a time and grabs the first thing it touches. Don\'t hook anything else!' + (hasSlow ? ' The pale see-through fish are slow: they only swim every second step.' : '') + ' The best you can do is ' + L.best + ' presses, counting the drop.');
    const pressChip = el('div', 'chip'), goalChip = el('div', 'chip goal', `<span>Best: ${L.best} presses</span>`);
    $('status').append(pressChip, goalChip);
    const { lake, place, draw } = makeLake(W, H);
    const items = [];
    L.rows.forEach((row, r) => row.items.forEach(it => {
      const svg = it.kind === 'gold' ? GOLD(row.dir) : it.kind === 'fish' ? fishSvg(FISH_COLS[(r * 3 + it.p) % FISH_COLS.length], row.dir) : it.kind === 'jelly' ? JELLY : it.kind === 'boot' ? BOOT : ROCK;
      const node = el('div', 'it', svg);
      if (row.slow === 2) { node.style.opacity = '.6'; node.style.filter = 'saturate(.6)'; }
      lake.appendChild(node); items.push({ node, row, r, it, last: null });
    }));
    const boat = el('div', 'it boat', BOAT); lake.appendChild(boat);
    const legend = el('div', 'legend', `<span>${GOLD(1)} Catch me!</span><span>${fishSvg(FISH_COLS[0])}${JELLY} Don't hook</span>` + (hasStill ? `<span>${BOOT}${ROCK} Stay still</span>` : '') + (hasSlow ? '<span>Pale = slow, moves every 2nd step</span>' : ''));
    const pad = el('div', 'pad');
    const bL = padButton('Left', 'left', () => move(-1)), bWait = padButton('Wait', 'wait', () => move(0)), bR = padButton('Right', 'right', () => move(1)), bDrop = padButton('Drop!', 'drop', drop, 'go');
    pad.append(bL, bWait, bR, bDrop);
    $('stage').append(lake, pad, legend);
    const btnFor = { left: bL, right: bR, wait: bWait, drop: bDrop };
    function render(jump) {
      for (const o of items) {
        const x = dPos(o.row, o.it, t, W);
        o.node.classList.toggle('noanim', !!jump || o.last == null || Math.abs(x - o.last) > 1);
        place(o.node, x, o.r + 1); o.last = x;
      }
      place(boat, bx, 0);
      draw(hookRow == null ? null : [[bx + .5, .62], [bx + .5, hookRow + 1.45]]);
      pressChip.innerHTML = `<span>Presses: ${presses}</span>`;
      [bL, bWait, bR, bDrop].forEach(b => b.disabled = busy || done);
      bL.disabled ||= bx === 0; bR.disabled ||= bx === W - 1;
    }
    const clearHint = () => Object.values(btnFor).forEach(b => b.classList.remove('hint'));
    function move(dx) {
      if (busy || done) return;
      if (bx + dx < 0 || bx + dx >= W) return;
      bx += dx; t++; presses++; clearHint();
      beep(dx ? 440 : 330, .06); setMsg('');
      render();
    }
    function drop() {
      if (busy || done) return;
      busy = true; presses++; clearHint(); splash(); setMsg('');
      let r = -1;
      const step = () => {
        r++; t++;
        if (r >= D) { hookRow = D - 1; render(); return finish(null); }
        hookRow = r; render();
        const k = dAt(L, bx, r, t);
        if (k) return finish(k);
        beep(300 - r * 25, .05, 'sine', .06);
        timer = setTimeout(step, 420);
      };
      timer = setTimeout(step, 150);
    }
    function finish(kind) {
      if (kind === 'gold') {
        done = true; render(); tune([660, 880, 1100], 90);
        let stars = presses <= L.best && !fails ? 3 : presses <= L.best + 3 && fails <= 1 ? 2 : 1;
        if (hinted) stars = Math.min(2, stars);
        const text = 'You caught it with ' + presses + ' presses' + (presses <= L.best ? ', as few as possible!' : '. The fewest is ' + L.best + '.') + (fails ? ' (' + fails + (fails === 1 ? ' miss' : ' misses') + ' first.)' : '');
        timer = setTimeout(() => win(stars, 'Great catch!', text), 700);
        return;
      }
      fails++;
      beep(150, .3, 'sawtooth', .05);
      const why = kind === 'fish' ? 'Oops! A little fish grabbed the hook.' : kind === 'jelly' ? 'Ouch! You hooked a jellyfish.' : kind === 'boot' ? 'You fished up an old boot!' : kind === 'rock' ? 'The hook got stuck on a rock.' : 'The hook sank past. The gold fish wasn\'t there yet!';
      setMsg(why + ' The fish go back to the start. Plan again!', 'bad', true);
      timer = setTimeout(() => { bx = L.start; t = 0; presses = 0; hookRow = null; busy = false; render(true); }, 1900);
    }
    function hint() {
      if (busy || done) return;
      const path = dSolve(L, bx, t);
      if (!path) return;
      hinted = true; clearHint();
      btnFor[path[0]].classList.add('hint');
      const word = { left: 'Left', right: 'Right', wait: 'Wait', drop: 'Drop' }[path[0]];
      setMsg('From here, press ' + word + ' next. Then keep watching the fish! Hints make the most stars 2.', '', true);
    }
    const onKey = e => {
      if (e.key === 'ArrowLeft') move(-1); else if (e.key === 'ArrowRight') move(1);
      else if (e.key === 'ArrowUp' || e.key === 'w') move(0); else if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); drop(); }

    addEventListener('keydown', onKey);
    cleanup = () => { clearTimeout(timer); removeEventListener('keydown', onKey); };
    action('Hint', hint, 'alt');
    render(true);
  }

  // ======================================================================
  // FISH MARKET
  // ======================================================================
  function buildMarket(M, lv) {
    const n = M.fish.length, B = M.targets.length, maxW = Math.max(...M.fish);
    const place = new Array(n).fill(0), locked = new Set();
    let sel = 1, wrong = 0, hinted = false, done = false, hintFish = -1, lastMoved = -1;
    const kg = w => w + ' kg';
    let q, spoken;
    if (M.kind === 'pick') {
      q = `Tiger wants exactly ${kg(M.targets[0])} of fish` + (M.count ? `, using ${M.count} fish.` : '.');
      spoken = q + (M.count ? '' : ' Use as many fish as you like.') + ' Tap fish to put them in the bucket. Tap a fish in the bucket to put it back. There is only one way that works!';
    } else if (M.kind === 'split') {
      q = `Share ALL the fish so ${B === 2 ? 'both cats get' : 'all 3 cats get'} ${kg(M.targets[0])} each.`;
      spoken = q + ' Tap a cat\'s bucket to choose it, then tap fish to give them to that cat. Every fish must go to a cat.';
    } else {
      q = 'Give each cat exactly the weight they want. Some fish can stay in the pond.';
      spoken = q + ' Tiger wants ' + kg(M.targets[0]) + ' and Smokey wants ' + kg(M.targets[1]) + '. Tap a bucket to choose it, then tap fish.';
    }
    setQ(q, spoken);
    const checksChip = el('div', 'chip'); $('status').append(checksChip);
    const cats = el('div', 'cats'), pond = el('div', 'pond');
    $('stage').append(el('p', 'label', B > 1 ? 'Buckets (tap one to fill it)' : 'Tiger\'s bucket'), cats, el('p', 'label', 'The pond (tap a fish)'), pond);
    const sumOf = b => M.fish.reduce((s, w, i) => s + (place[i] === b ? w : 0), 0);
    const countOf = b => place.filter(p => p === b).length;
    function fishBtn(i) {
      const w = M.fish[i], sc = (.72 + .28 * w / maxW).toFixed(2);
      const b = el('button', 'fishbtn' + (locked.has(i) ? ' locked' : '') + (i === hintFish ? ' hint' : '') + (i === lastMoved ? ' new' : ''),
        `<span style="display:grid;width:100%;height:100%;transform:scale(${sc})">${fishSvg(FISH_COLS[M.colors[i]], i % 2 ? -1 : 1)}</span><span class="kg"${i % 2 ? ' style="transform:translate(-38%,-50%)"' : ''}>${w}</span>`);
      b.type = 'button';
      b.setAttribute('aria-label', 'Fish weighing ' + kg(w) + (place[i] ? ', in ' + CAT_NAMES[place[i] - 1] + '\'s bucket' : ', in the pond'));
      b.addEventListener('click', e => { e.stopPropagation(); tapFish(i); });
      return b;
    }
    function draw() {
      cats.innerHTML = '';
      for (let b = 1; b <= B; b++) {
        const sum = sumOf(b), tgt = M.targets[b - 1];
        const card = el('div', 'bucket' + (B > 1 && sel === b ? ' sel' : ''));
        card.setAttribute('role', 'button'); card.tabIndex = 0;
        card.setAttribute('aria-label', CAT_NAMES[b - 1] + ' wants ' + kg(tgt) + ', has ' + kg(sum) + (B > 1 ? (sel === b ? ', chosen' : ', tap to choose') : ''));
        const extra = M.count && b === 1 ? `<br><small>using ${M.count} fish (${countOf(1)} now)</small>` : '';
        card.innerHTML = `<div class="who">${catSvg(CAT_COLS[b - 1])}<div class="order">${CAT_NAMES[b - 1]} wants<br><b>${kg(tgt)}</b>${extra}</div></div><div class="total ${sum === tgt ? 'ok' : sum > tgt ? 'over' : ''}">Has ${kg(sum)}</div>`;
        const tray = el('div', 'tray');
        M.fish.forEach((_, i) => { if (place[i] === b) tray.appendChild(fishBtn(i)); });
        card.appendChild(tray);
        const choose = () => { if (B > 1 && sel !== b) { sel = b; beep(600, .05); draw(); } };
        card.addEventListener('click', choose);
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); choose(); } });
        cats.appendChild(card);
      }
      pond.innerHTML = '';
      M.fish.forEach((_, i) => { if (!place[i]) pond.appendChild(fishBtn(i)); });
      if (!pond.children.length) pond.appendChild(el('span', '', '<b style="color:#fff">The pond is empty!</b>'));
      checksChip.innerHTML = `<span>Wrong checks: ${wrong}</span>`;
      lastMoved = -1;
    }
    function tapFish(i) {
      if (done) return;
      if (locked.has(i)) { setMsg('The hint put that fish there. It\'s the right spot!', '', true); return; }
      hintFish = -1;
      if (place[i]) { place[i] = 0; beep(380, .06); }
      else { place[i] = sel; beep(560, .06); splash(); }
      lastMoved = i; setMsg('');
      draw();
    }
    function check() {
      if (done) return;
      if (place.every(p => !p)) { setMsg('Put some fish in ' + (B > 1 ? 'the buckets' : 'the bucket') + ' first!', '', true); return; }
      const probs = [];
      for (let b = 1; b <= B; b++) {
        const s = sumOf(b), tgt = M.targets[b - 1], nm = CAT_NAMES[b - 1];
        if (s > tgt) probs.push(`${nm}'s bucket is too heavy. It has ${kg(s)}, but ${nm} wants ${kg(tgt)}.`);
        else if (s < tgt) probs.push(`${nm}'s bucket is too light. It has ${kg(s)}, but ${nm} wants ${kg(tgt)}.`);
      }
      if (M.count && countOf(1) !== M.count) probs.push(`Tiger wants exactly ${M.count} fish, but the bucket has ${countOf(1)}.`);
      if (M.kind === 'split' && countOf(0)) probs.push('There are still fish in the pond. Every fish must go to a cat!');
      if (!probs.length) {
        done = true; draw(); tune([660, 880, 1100], 90);
        let stars = wrong === 0 ? 3 : wrong === 1 ? 2 : 1;
        if (hinted) stars = Math.min(2, stars);
        const text = (B > 1 ? 'Every cat is happy!' : 'Tiger is happy!') + (wrong ? ' You checked ' + (wrong + 1) + ' times.' : ' Right on the first check!');
        setTimeout(() => win(stars, 'Purr-fect!', text), 500);
        return;
      }
      wrong++; beep(150, .3, 'sawtooth', .05);
      cats.classList.add('shake'); setTimeout(() => cats.classList.remove('shake'), 320);
      setMsg(probs[0], 'bad', true); draw();
    }
    // the answer, with buckets renamed to best match what the player has done (in a share-out any cat can get any pile)
    function answer() {
      let perms = [[...Array(B + 1).keys()]];
      if (M.kind === 'split') {
        const per = a => a.length <= 1 ? [a] : a.flatMap((x, i) => per([...a.slice(0, i), ...a.slice(i + 1)]).map(p => [x, ...p]));
        perms = per([...Array(B).keys()].map(k => k + 1)).map(p => [0, ...p]);
      }
      let best = null, bestScore = -1;
      for (const p of perms) {
        const ans = M.solution.map(b => p[b]);
        if ([...locked].some(i => ans[i] !== place[i])) continue;
        const score = ans.filter((b, i) => b === place[i]).length;
        if (score > bestScore) { best = ans; bestScore = score; }
      }
      return best;
    }
    function hint() {
      if (done) return;
      const ans = answer();
      const order = [...Array(n).keys()].filter(i => !locked.has(i) && place[i] !== ans[i]);
      if (!order.length) { setMsg('Everything is in the right place. Press Check!', '', true); return; }
      const i = order.find(k => place[k] && ans[k] === 0) ?? order.find(k => ans[k] > 0) ?? order[0];
      hinted = true; place[i] = ans[i]; locked.add(i); hintFish = i; lastMoved = i;
      setMsg(ans[i] ? 'The ' + kg(M.fish[i]) + ' fish belongs to ' + CAT_NAMES[ans[i] - 1] + '. Hints make the most stars 2.' : 'The ' + kg(M.fish[i]) + ' fish doesn\'t belong in any bucket. Hints make the most stars 2.', '', true);
      draw();
    }
    action('Check!', check, 'go');
    action('Empty buckets', () => { if (done) return; for (let i = 0; i < n; i++) if (!locked.has(i)) place[i] = 0; hintFish = -1; setMsg(''); beep(300, .08); draw(); }, 'alt');
    action('Hint', hint, 'alt');
    draw();
  }

  // ======================================================================
  // CURRENT MAZE
  // ======================================================================
  function buildCurrents(C, lv) {
    const W = C.W, H = C.H + 1, K = C.flips, orig = C.grid;
    let grid = C.grid.slice(), bx = C.start, fails = 0, hinted = false, busy = false, done = false, shown = null, hintCell = null, hintCol = -1, timer = null;
    const flipsUsed = () => { let k = 0; grid.forEach((row, y) => { for (let x = 0; x < W; x++) if (row[x] !== orig[y][x]) k++; }); return k; };
    setQ(K === 0 ? 'Where should the boat stop so the hook reaches the gold fish?' : `Flip ${K === 1 ? '1 current' : K + ' currents'}, then pick a spot so the hook reaches the gold fish!`,
      (K === 0 ? 'Where should the boat stop so the hook reaches the gold fish?' : 'You can flip ' + K + (K === 1 ? ' current' : ' currents') + ' by tapping them. Then pick where the boat stops.')
      + ' The hook sinks straight down. When it lands on a current, it gets pushed one step the way the arrow points. Rocks stop the hook. Don\'t hook the little fish or the old boot! Try to get it right first time.');
    const flipChip = el('div', 'chip goal'), triesChip = el('div', 'chip');
    $('status').append(...(K ? [flipChip] : []), triesChip);
    const { lake, place, draw } = makeLake(W, H);
    const cellsLayer = el('div'); lake.appendChild(cellsLayer);
    const boat = el('div', 'it boat', BOAT); lake.appendChild(boat);
    for (let x = 0; x < W; x++) {
      const s = el('button', 'skybtn'); s.type = 'button'; s.style.left = (x / W * 100) + '%';
      s.setAttribute('aria-label', 'Move the boat to spot ' + (x + 1));
      s.addEventListener('click', () => moveTo(x)); lake.appendChild(s);
    }
    const pad = el('div', 'pad');
    const bL = padButton('Left', 'left', () => moveTo(bx - 1)), bR = padButton('Right', 'right', () => moveTo(bx + 1)), bDrop = padButton('Drop!', 'drop', drop, 'go');
    pad.style.gridTemplateColumns = 'repeat(3, auto)';
    pad.append(bL, bR, bDrop);
    const legend = el('div', 'legend', `<span>${GOLD(1)} Catch me!</span><span>${'<span style="display:inline-grid;width:26px;height:26px;background:#2a9fd6;border-radius:6px">' + CURRENT(false) + '</span>'} Pushes the hook</span><span>${ROCK} Stops it</span><span>${fishSvg(FISH_COLS[0])}${BOOT} Don't hook</span>`);
    $('stage').append(lake, pad, legend);
    function render() {
      cellsLayer.innerHTML = '';
      grid.forEach((row, y) => [...row].forEach((c, x) => {
        if (c === '.') return;
        let node;
        if (c === '<' || c === '>') {
          node = el('button', 'cell cur' + (c !== orig[y][x] ? ' flipped' : '') + (hintCell && hintCell[0] === x && hintCell[1] === y ? ' hint' : ''), CURRENT(c === '<'));
          node.type = 'button';
          node.setAttribute('aria-label', 'Current pushing ' + (c === '<' ? 'left' : 'right') + (c !== orig[y][x] ? ', flipped' : '') + '. Tap to flip');
          node.addEventListener('click', () => flip(x, y));
        } else node = el('div', 'cell', c === 'G' ? GOLD(x < W / 2 ? 1 : -1) : c === 'f' ? fishSvg(FISH_COLS[(x + y) % FISH_COLS.length], x % 2 ? 1 : -1) : c === 'b' ? BOOT : ROCK);
        place(node, x, y + 1); cellsLayer.appendChild(node);
      }));
      place(boat, bx, 0);
      lake.querySelectorAll('.skybtn').forEach((s, x) => s.classList.toggle('hint', x === hintCol));
      lake.querySelectorAll('.skybtn.hint').forEach(s => { s.style.outline = '4px solid #ffc93c'; s.style.outlineOffset = '-4px'; s.style.borderRadius = '10px'; });
      lake.querySelectorAll('.skybtn:not(.hint)').forEach(s => { s.style.outline = ''; });
      if (shown) draw([[bx + .5, .62], ...shown.map(([x, y]) => [x + .5, y + 1.5])]); else draw(null);
      flipChip.innerHTML = `<span>Flips: ${flipsUsed()} of ${K}</span>`;
      triesChip.innerHTML = `<span>Misses: ${fails}</span>`;
      [bL, bR, bDrop].forEach(b => b.disabled = busy || done);
      bL.disabled ||= bx === 0; bR.disabled ||= bx === W - 1;
    }
    function moveTo(x) {
      if (busy || done || x < 0 || x >= W || x === bx) return;
      bx = x; shown = null; hintCol = -1; beep(440, .05); setMsg(''); render();
    }
    function flip(x, y) {
      if (busy || done) return;
      if (!K) { setMsg('In this pond you can\'t flip currents. Just pick where the boat stops!', '', true); return; }
      const isFlipped = grid[y][x] !== orig[y][x];
      if (!isFlipped && flipsUsed() >= K) { setMsg('You can only flip ' + K + '. Tap a yellow one to put it back.', 'bad', true); beep(160, .15); return; }
      const row = grid[y].split(''); row[x] = row[x] === '<' ? '>' : '<'; grid[y] = row.join('');
      shown = null; hintCell = null; beep(isFlipped ? 420 : 620, .07); setMsg(''); render();
    }
    function drop() {
      if (busy || done) return;
      busy = true; hintCell = null; hintCol = -1; splash(); setMsg('');
      const tr = cTrace(grid, bx);
      const path = tr.path.filter(p => p[1] >= 0);
      let k = 0; shown = [];
      render();
      const step = () => {
        if (k < path.length) { shown = path.slice(0, ++k); render(); beep(320 + (k % 4) * 40, .04, 'sine', .05); timer = setTimeout(step, 230); return; }
        finish(tr.end);
      };
      timer = setTimeout(step, 150);
    }
    function finish(end) {
      busy = false;
      if (end === 'gold') {
        done = true; render(); tune([660, 880, 1100], 90);
        let stars = fails === 0 ? 3 : fails === 1 ? 2 : 1;
        if (hinted) stars = Math.min(2, stars);
        setTimeout(() => win(stars, 'Great catch!', fails ? 'You got it after ' + fails + (fails === 1 ? ' miss.' : ' misses.') + ' Can you get one first time?' : 'First try! You worked out the whole path in your head.'), 600);
        return;
      }
      fails++; beep(150, .3, 'sawtooth', .05); render();
      const why = { fish: 'Oops! A little fish grabbed the hook.', boot: 'You fished up an old boot!', snag: 'The hook got stuck on a rock.', loop: 'The currents spun the hook round and round!', bottom: 'The hook sank to the bottom with nothing.' }[end];
      setMsg(why + ' Follow the line to see where it went.', 'bad', true);
    }
    function hint() {
      if (busy || done) return;
      hinted = true; shown = null;
      let best = null;
      for (const s of C.sols) {
        const target = cFlip(orig, s.flips), diff = [];
        target.forEach((row, y) => { for (let x = 0; x < W; x++) if (row[x] !== grid[y][x]) diff.push([x, y]); });
        const cost = diff.length + (s.x !== bx ? 1 : 0);
        if (!best || cost < best.cost) best = { cost, diff, x: s.x };
      }
      if (best.diff.length) {
        hintCell = best.diff[0];
        const [x, y] = hintCell;
        setMsg((grid[y][x] !== orig[y][x] ? 'Put the glowing current back the way it was.' : 'Try flipping the glowing current.') + ' Hints make the most stars 2.', '', true);
      } else if (best.x !== bx) { hintCol = best.x; setMsg('The currents are right! Stop the boat above the glowing spot.', '', true); }
      else setMsg('Everything is set. Drop the hook!', '', true);
      render();
    }
    const onKey = e => { if (e.key === 'ArrowLeft') moveTo(bx - 1); else if (e.key === 'ArrowRight') moveTo(bx + 1); else if (e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); drop(); } };
    addEventListener('keydown', onKey);
    cleanup = () => { clearTimeout(timer); removeEventListener('keydown', onKey); };
    action('Hint', hint, 'alt');
    if (K) action('Undo flips', () => { if (busy || done) return; grid = orig.slice(); shown = null; hintCell = null; beep(300, .08); setMsg(''); render(); }, 'alt');
    render();
  }

  // ---------- go ----------
  window.__pp = { makeDrop, makeMarket, makeCurrents, dSolve, dDrop, dPos, cTrace, cFlip, mSolutions, startLevel, AREAS, get save() { return save; } };
  showMap();
  if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {}));

})();
</script>
</body>
